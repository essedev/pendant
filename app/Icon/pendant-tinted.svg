<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Pendant app icon, tinted appearance: grayscale on a clear ground, iOS applies the tint. -->
  <defs>
    <radialGradient id="face" cx="0.4" cy="0.36" r="0.75">
      <stop offset="0" stop-color="#4c4c4c"/>
      <stop offset="1" stop-color="#2b2b2b"/>
    </radialGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="512" cy="512" r="340" fill="#6f6f6f"/>
  <circle cx="512" cy="512" r="332" fill="none" stroke="#8a8a8a" stroke-width="6"/>
  <circle cx="512" cy="512" r="276" fill="url(#face)"/>
  <circle cx="512" cy="512" r="78" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="30" fill="#ffffff"/>
</svg>
