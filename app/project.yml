name: Pendant
options:
  bundleIdPrefix: dev.esse
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
packages:
  PendantKit:
    path: PendantKit
targets:
  Pendant:
    type: application
    platform: iOS
    sources:
      - Pendant
    dependencies:
      - package: PendantKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.esse.pendant
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Pendant si collega al ciondolo Omi per riceverne l'audio."
    info:
      path: Pendant/Info.plist
      properties:
        UIBackgroundModes:
          - bluetooth-central
