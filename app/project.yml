name: Pendant
options:
  bundleIdPrefix: dev.esse
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
packages:
  PendantKit:
    path: PendantKit
settings:
  base:
    MARKETING_VERSION: "0.4.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Pendant:
    type: application
    platform: iOS
    sources:
      - Pendant
      - Shared
    dependencies:
      - package: PendantKit
      - target: PendantWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.esse.pendant
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pendant
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # iPhone only, portrait; the iPad key only quiets the multitasking check of Xcode 26.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "Serve per ricevere l’audio dal ciondolo."
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
    info:
      path: Pendant/Info.plist
      properties:
        UIBackgroundModes:
          - bluetooth-central
        UIAppFonts:
          - Archivo.ttf
    entitlements:
      path: Pendant/Pendant.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.esse.pendant
  PendantWidgets:
    type: app-extension
    platform: iOS
    sources:
      - PendantWidgets
      - Shared
      - path: Pendant/Resources/Archivo.ttf
        buildPhase: resources
    dependencies:
      - package: PendantKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.esse.pendant.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pendant
        SKIP_INSTALL: YES
    info:
      path: PendantWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - Archivo.ttf
    entitlements:
      path: PendantWidgets/PendantWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.esse.pendant
