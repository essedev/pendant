<!doctype html>
<html lang="it">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Concept B - App completa</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap" rel="stylesheet" />
		<!--
			Concept B: il mock completo dell'app, da implementare in SwiftUI senza altri giri di design.
			Parte dalla variante L di concept-a-app-fable.html (scelta il 26/11/2026): palette Grafite e
			rosso con spia REC piena, display come materiale, seconda tinta alluminio, scala in dB, tasto
			incassato. Stessi token, stessa scala, stessi componenti: qui sono fissi, senza pannello di
			taratura. I colori sono quelli della tabella in ARCHITECTURE #Interfaccia.

			COME SI USA
			- Indice a sinistra: ogni voce porta a una schermata in uno stato preciso. Frecce su e giù
			  (o sinistra e destra) per scorrere l'indice.
			- Il telefono è navigabile: le righe aprono le pagine, il tasto indietro torna, i selettori
			  aprono un foglio, interruttori e regoli funzionano, il tasto Pausa cambia stato.
			- t tema chiaro o scuro, i annotazioni (riquadri numerati sul telefono, elenco a destra),
			  p nasconde indice e barra, Esc chiude il foglio o torna indietro.
			- L'indirizzo ha l'ancora della schermata (#adesso-pausa): si può linkare.

			SCHERMATE
			Primo avvio: benvenuto, permesso Bluetooth (spiegazione, richiesta di iOS, negato), ricerca
			  del ciondolo (cerca, trovato, collegamento, collegato, non trovato), server (vuoto, prova
			  in corso, riuscita, indirizzo irraggiungibile, token rifiutato, protocollo diverso),
			  notifiche, fine.
			Adesso: registra, in pausa, ciondolo scollegato, server irraggiungibile con coda, ciondolo in
			  carica, batteria bassa, Bluetooth spento, accensione inattesa, primo uso senza conversazioni.
			Oggi: oggi, oggi con la coda, giorno vuoto, ieri, dettaglio di una conversazione (inviata,
			  in corso, interrotta).
			Impostazioni: radice, Ciondolo (collegato e scollegato), Gesti, Note, Audio offline,
			  Notifiche, Server, Comandi di sistema, Avanzate, Informazioni, Licenze; fogli di scelta,
			  di testo, conferma per dimenticare il ciondolo, esportazione del log.
			Sistema: blocco schermo con l'attività in tempo reale (registra, in pausa, in coda), Dynamic
			  Island compatta, minima ed estesa, Centro di Controllo, conferma del tasto Azione, le
			  quattro notifiche locali.
			Errori: Bluetooth negato dopo il primo avvio, token rifiutato mentre registra, coda quasi
			  piena, firmware non supportato.

			DECISIONI PRESE QUI (da confermare)
			1. La scheda Adesso scorre. Con un avviso sotto il tasto il contenuto supera lo schermo: il
			   display e il tasto restano in alto, la giornata passa sotto la barra di vetro.
			2. Gli avvisi sono una cella sotto il tasto: anello vuoto ambra, una frase che dice cosa è
			   successo e cosa fare, al massimo due azioni. Uno alla volta: vince il più grave (permesso,
			   Bluetooth, token, coda, batteria, firmware, accensione).
			3. In carica il ciondolo continua a registrare e cambia solo la riga della batteria. Non è
			   verificato sul ciondolo: se il firmware ferma l'audio in carica, lo stato diventa una
			   spia a contorno "In carica da".
			4. Coda piena: si perde l'audio più vecchio. ARCHITECTURE non lo dice; il testo dell'avviso
			   dipende da questa scelta.
			5. Nessun rosso fuori dalla registrazione, nemmeno per "Dimentica il ciondolo": la riga è
			   inchiostro e la conferma è un confirmationDialog senza ruolo distruttivo.
			6. Il rosso non è nemmeno la tinta di sistema: interruttori e selezioni usano l'inchiostro
			   (.tint), il segno di spunta dei selettori è inchiostro.
			7. Le impostazioni hanno una radice corta con le pagine; la cella del ciondolo in testa è un
			   display piccolo, come in L. "Registrazione" di L è sparita: la lingua sta in Server
			   (è un parametro del flusso), la coda senza rete in Avanzate.
			8. Oggi: il giorno si cambia con due tasti di vetro in alto a destra (e, nell'app, con lo
			   scorrimento orizzontale). I segnalibri sono triangoli sopra la striscia della giornata.
			9. Un gesto si può assegnare anche a "Segna questo momento" o a "Niente": la mappa è già
			   nella configurazione.
			10. Il regolo a tacche serve due valori: luminosità della spia (33 tacche) e guadagno del
			    microfono (9 tacche). Un solo componente.
			11. Dopo 99 minuti il tempo del display passa da 12m08s a 1h42m, senza secondi, per restare
			    nella larghezza.
			12. Primo avvio: i passi sono sei tacche in alto. La richiesta di permesso di iOS arriva dopo
			    una schermata che la spiega, mai da sola.
			13. L'attività in tempo reale è un display piccolo (stesso fondo grafite), con un tasto
			    Pausa a capsula; sul tasto Azione il default è "Segna questo momento".

			PER CHI IMPLEMENTA
			- Font: Archivo variabile (OFL) in UIAppFonts, con l'asse wdth. Larghezza 112% solo sulle
			  cifre grandi del display, 100% altrove. Cifre tabellari ovunque ci sono numeri che cambiano.
			- Scala del testo: 11 (etichette della barra, scala in dB), 13, 15, 17, 22, 34, 72 (tempo del
			  display, unità a 28). Pesi 400, 500, 600. Niente altre misure.
			- Spazi su griglia da 4 e 8. Raggi concentrici: schermo 55; display 28 dentro una cornice
			  da 6 (34 fuori); tasto 28 nella stessa cornice; celle 20; fogli 38 in alto e 47 in basso a
			  8 dal bordo (55 meno 8); barra di sistema.
			- Vetro (.glassEffect) solo su ciò che galleggia sul contenuto: barra delle schede, tasti
			  della barra di navigazione, fogli, avvisi di sistema. Il resto è superficie piena.
			- Il bianco su #e5402f misura 4,1:1 e su #ff5a47 (scuro) 3,1:1: sotto il 4,5:1 del
			  testo normale. È la scelta di L (spia e tasto Riprendi); se serve rientrare, nel tema
			  scuro si può usare #e5402f anche per i fondi pieni.
			- Tempo: Text(timerInterval:) nell'attività in tempo reale; nell'app un TimelineView.
			- Con "Riduci movimento" il livello resta fermo e le pagine non scorrono; il tempo avanza
			  comunque, perché è il contenuto.
			- Le annotazioni (tasto i) dicono per ogni schermata il blocco SwiftUI, misure e token.

			DATI
			Veri: firmware 3.0.21, batteria 84%, conversazioni di oggi 09:04 da 43 min, 11:30 da 48 min,
			17:21 da 4 min 47 s, server.example.com, 53 pacchetti in memoria, versione 0.3.0, firma che scade
			il 3 dicembre. Plausibili: tutto il resto (ieri, i segnalibri, i minuti negli stati).

			COSA IL MOCK NON MOSTRA
			La rifrazione vera del vetro, la tastiera, le animazioni di sistema (foglio, Dynamic Island),
			la vibrazione, VoiceOver e il testo dinamico, le superfici di sistema come le disegna
			davvero iOS (qui sono ricostruite a mano).
		
			Giro 2 (27/11/2026): Simone vuole i display scuri cambiati nel tema chiaro, verso un LCD
			come quelli Casio, e più colore anche quando non registra, in tutti e due i temi. Tasti
			x a b c: X oggi; A Casio (LCD verde-grigio, accento arancio), B G-Shock (grigio-azzurro,
			blu), C Carta (LCD caldo, verde petrolio). Nel tema scuro il display resta grafite e
			cambia solo l'accento. L'accento va su interruttori, scheda attiva, tasti a capsula e
			indietro, tacche registrate della giornata, spia "In pausa" e "in linea" sul display. Il
			rosso resta solo registrazione (spia REC, livello, Riprendi).

			Giro 2, scelta (27/11/2026): niente palette unica, l'app ha un selettore di temi con
			questi abbinamenti e quelli di concept-a-app-fable.html, più display e accento liberi
			(DECISIONS 2026-11-27, "Temi").

			Scelta (26/11/2026): tutte le decisioni del report confermate; in M7 il rosso pieno sullo
			scuro usa #e5402f per tornare a 4,5:1 col bianco. Da verificare sul ciondolo: registra anche
			in carica.
		-->
		<style>
			* { box-sizing: border-box; }
			html, body { margin: 0; }
			body { min-height: 100vh; background: #dcdee3; color: #23252a; font: 13px/1.45 system-ui, -apple-system, sans-serif; }
			:root[data-theme='dark'] body { background: #1a1b1e; color: #d5d7dc; }
			[hidden] { display: none !important; }
			button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; text-align: inherit; }
			button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--ink, #1f6feb); outline-offset: 2px; }
			h1, h2, h3, h4, p, ol, ul, figure, dl, dd { margin: 0; padding: 0; }
			ol, ul { list-style: none; }
			input { font: inherit; color: inherit; }

			/* Concept chrome: bar, index, notes. Not part of the design. */
			.bar { position: sticky; top: 0; z-index: 100; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; background: #111214; color: #b4b7bd; }
			.bar strong { color: #fff; font-weight: 600; margin-right: 4px; }
			.bar button { padding: 6px 10px; border-radius: 6px; background: #26282c; color: #eeeff1; }
			.bar button[aria-pressed='true'] { background: #eeeff1; color: #111214; }
			.bar p { flex: 1 1 260px; min-width: 0; margin-left: 4px; }
			.bar kbd { font: 600 12px/1 ui-monospace, Menlo, monospace; padding: 2px 5px; border-radius: 4px; background: #34373c; color: #fff; }
			.work { display: flex; align-items: flex-start; justify-content: center; gap: 32px; padding: 24px 16px 48px; }
			.index { flex: none; width: 232px; position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow-y: auto; padding-right: 4px; }
			.index h2 { margin: 16px 0 4px; font: 600 13px/18px system-ui, sans-serif; color: #50545c; }
			.index h2:first-child { margin-top: 0; }
			:root[data-theme='dark'] .index h2 { color: #a4a8b0; }
			.index button { display: block; width: 100%; padding: 5px 8px; border-radius: 6px; font-size: 13px; line-height: 18px; }
			.index button:hover { background: rgb(0 0 0 / 0.06); }
			:root[data-theme='dark'] .index button:hover { background: rgb(255 255 255 / 0.08); }
			.index button[aria-current='true'] { background: #111214; color: #fff; }
			:root[data-theme='dark'] .index button[aria-current='true'] { background: #eeeff1; color: #111214; }
			.stage { flex: none; display: grid; gap: 12px; justify-items: center; }
			.stage figcaption { color: #50545c; max-width: 410px; text-align: center; }
			:root[data-theme='dark'] .stage figcaption { color: #a4a8b0; }
			.notes { flex: 0 1 340px; min-width: 260px; position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow-y: auto; }
			body:not([data-anno='on']) .notes { display: none; }
			.notes h2 { font: 600 15px/20px system-ui, sans-serif; margin-bottom: 8px; }
			.notes ol { display: grid; gap: 10px; }
			.notes li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; }
			.notes li > b { width: 20px; height: 20px; border-radius: 10px; background: #1f6feb; color: #fff; font: 600 11px/20px system-ui, sans-serif; text-align: center; }
			.notes li strong { display: block; font-weight: 600; }
			.notes li.hot { background: rgb(31 111 235 / 0.1); outline: 6px solid rgb(31 111 235 / 0.1); border-radius: 2px; }
			.notes details { margin-top: 20px; padding-top: 12px; border-top: 1px solid rgb(128 128 128 / 0.3); }
			.notes summary { cursor: pointer; font-weight: 600; }
			.notes table { margin-top: 8px; border-collapse: collapse; width: 100%; font-size: 12px; }
			.notes td { padding: 3px 6px 3px 0; vertical-align: top; }
			.notes td i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 6px; box-shadow: 0 0 0 1px rgb(128 128 128 / 0.4); }
			.notes code { font: 12px/1.4 ui-monospace, Menlo, monospace; }
			body[data-chrome='off'] .bar, body[data-chrome='off'] .index { display: none; }
			@media (max-width: 760px) { .work { flex-wrap: wrap; } .index, .notes { position: static; width: 100%; max-height: none; flex-basis: 100%; } }

			/* The phone: 390x844 screen, radius 55, bezel 10. */
			.phone { position: relative; width: 410px; height: 864px; padding: 10px; border-radius: 65px; background: #08080a; box-shadow: 0 0 0 1px #34363b, 0 24px 48px rgb(0 0 0 / 0.22); }
			.abtn { position: absolute; left: -4px; top: 178px; width: 4px; height: 34px; border-radius: 2px 0 0 2px; background: #34363b; }
			.phone.hold .abtn { background: #ff5a47; left: -2px; }
			.screen { position: relative; width: 390px; height: 844px; border-radius: 55px; overflow: hidden; background: var(--bg); color: var(--ink); font: 400 17px/24px var(--font); -webkit-font-smoothing: antialiased; isolation: isolate;
				--font: 'Archivo', sans-serif;
				--bg: #e4e5e2; --cell: #f1f1ef; --ink: #15171b; --ink2: #5b6068; --ink3: #a5a9b0; --line: #dfe0dc; --off: #d2d3cf; --bezel: #cfd0cc;
				--led: #e5402f; --meter: #ff5a47; --warn: #9a5600; --key: #2b2e34; --tape-rec: #7c818a;
				--lcd: #2b2e34; --lcd-ink: #f1f2f4; --lcd-ink2: #a9aeb7; --lcd-dim: #3d4149; --lcd-line: #464a53; --lcd-warn: #f0a840;
				--on: #15171b; --pill: rgb(21 23 27 / 0.08);
				--glass: rgb(241 241 239 / 0.66); --glass-rim: rgb(255 255 255 / 0.7); --glass-top: #fff; --glass-shadow: rgb(21 23 27 / 0.12); --sheet: rgb(236 237 234 / 0.9); --scrim: rgb(0 0 0 / 0.3); }
			:root[data-theme='dark'] .screen {
				--bg: #141518; --cell: #1d1f23; --ink: #ecedef; --ink2: #9a9ea6; --ink3: #555961; --line: #2a2c31; --off: #2a2c30; --bezel: #2c2f34;
				--led: #ff5a47; --meter: #ff5a47; --warn: #f0a840; --key: #3a3e46; --tape-rec: #6f757f;
				--lcd: #23262b; --lcd-ink: #eceef1; --lcd-ink2: #9ba0a9; --lcd-dim: #34383f; --lcd-line: #3a3e45; --lcd-warn: #f0a840;
				--on: #7d8594; --pill: rgb(255 255 255 / 0.1);
				--glass: rgb(34 36 40 / 0.62); --glass-rim: rgb(255 255 255 / 0.1); --glass-top: rgb(255 255 255 / 0.16); --glass-shadow: rgb(0 0 0 / 0.5); --sheet: rgb(30 32 36 / 0.9); --scrim: rgb(0 0 0 / 0.5); }
			#view { position: absolute; inset: 0; }
			.island { position: absolute; z-index: 60; top: 11px; left: 50%; width: 126px; height: 37px; margin-left: -63px; border-radius: 19px; background: #000; color: #fff; }
			.statusbar { position: absolute; z-index: 35; top: 0; left: 0; right: 0; height: 54px; padding-top: 7px; display: flex; justify-content: space-between; align-items: center; font: 600 17px/1 -apple-system, 'SF Pro Text', system-ui, sans-serif; letter-spacing: -0.01em; }
			.statusbar > span { width: 132px; display: flex; justify-content: center; align-items: center; gap: 6px; }
			.statusbar svg { display: block; }
			.homebar { position: absolute; z-index: 70; bottom: 8px; left: 50%; width: 138px; height: 5px; margin-left: -69px; border-radius: 3px; background: var(--ink); pointer-events: none; }
			.sb-fade { position: absolute; z-index: 30; top: 0; left: 0; right: 0; height: 64px; background: linear-gradient(var(--bg) 54px, transparent); pointer-events: none; }
			.sb-fade.tall { height: 116px; background: linear-gradient(var(--bg) 96px, transparent); }
			.sb-fade.bottom { z-index: 15; top: auto; bottom: 0; height: 120px; background: linear-gradient(transparent, var(--bg) 88px); }
			.num { font-variant-numeric: tabular-nums; }

			/* Glass: tab bar, navigation buttons, sheets, system alerts. */
			.glass { background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(170%); backdrop-filter: blur(18px) saturate(170%); box-shadow: inset 0 0 0 1px var(--glass-rim), inset 0 1px 0 var(--glass-top), 0 10px 28px var(--glass-shadow); }
			.dock { position: absolute; z-index: 20; left: 21px; right: 21px; bottom: 21px; display: flex; }
			.tabbar { flex: 1; height: 64px; padding: 4px; border-radius: 32px; display: flex; }
			.tabbar button { flex: 1; border-radius: 28px; display: grid; justify-items: center; align-content: center; gap: 3px; font: 600 11px/13px var(--font); color: var(--ink2); text-align: center; }
			.tabbar button svg { width: 24px; height: 24px; }
			.tabbar button[aria-current='true'] { background: var(--pill); color: var(--ink); }
			.nav { position: absolute; z-index: 36; top: 56px; left: 16px; right: 16px; height: 44px; display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
			.nav h1 { position: absolute; left: 60px; right: 60px; text-align: center; font: 600 17px/22px var(--font); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
			.nav-btn { pointer-events: auto; width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; color: var(--ink); }
			.nav-btn svg { width: 22px; height: 22px; }
			.nav-btn:disabled { color: var(--ink3); cursor: default; }
			.nav-pair { pointer-events: auto; display: flex; height: 44px; border-radius: 22px; margin-left: auto; }
			.nav-pair .nav-btn { width: 46px; }

			/* Pages and lists. */
			.scroll { position: absolute; inset: 0; overflow-y: auto; padding: 62px 0 128px; scrollbar-width: none; }
			.scroll::-webkit-scrollbar { display: none; }
			.scroll.pushed { padding-top: 112px; }
			.scroll.bare { padding-bottom: 48px; }
			.page-in { animation: push 0.26s cubic-bezier(0.2, 0.8, 0.2, 1); }
			.page-back { animation: pop 0.26s cubic-bezier(0.2, 0.8, 0.2, 1); }
			@keyframes push { from { transform: translateX(36px); opacity: 0.4; } }
			@keyframes pop { from { transform: translateX(-36px); opacity: 0.4; } }
			.set-title { margin: 0 24px 16px; font: 600 34px/40px var(--font); letter-spacing: -0.02em; }
			.set-sub { margin: -12px 24px 20px; font-size: 15px; line-height: 20px; color: var(--ink2); font-variant-numeric: tabular-nums; }
			.grp h3 { margin: 28px 32px 8px; font: 500 13px/18px var(--font); color: var(--ink2); }
			.grp { margin-top: 20px; }
			.grp:has(h3) { margin-top: 0; }
			.scroll > .grp:first-child, .scroll > div:first-child > .grp, .scroll > .grp:first-child h3, .scroll > div:first-child > .grp h3 { margin-top: 0; }
			.rows { margin: 0 16px; padding: 0 16px; border-radius: 20px; background: var(--cell); }
			.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; }
			.row + .row, .row + .rule, .rule + .row { border-top: 1px solid var(--line); }
			.row .main { flex: 1; min-width: 0; padding: 8px 0; }
			.row .main small { display: block; font: 400 13px/18px var(--font); color: var(--ink2); text-wrap: pretty; }
			.row .value { font-size: 17px; color: var(--ink2); white-space: nowrap; font-variant-numeric: tabular-nums; max-width: 190px; overflow: hidden; text-overflow: ellipsis; }
			.row .value.warn { color: var(--warn); }
			.row .chev { flex: none; width: 8px; height: 14px; color: var(--ink3); }
			.row .check { flex: none; width: 20px; height: 20px; color: var(--ink); }
			.row .btn, .btn { flex: none; height: 36px; padding: 0 14px; border-radius: 18px; background: var(--pill); font: 500 15px/36px var(--font); white-space: nowrap; color: var(--ink); }
			.row[disabled], .row.dis { color: var(--ink3); }
			.row.dis .value, .row.dis small { color: var(--ink3); }
			.btn:disabled { color: var(--ink3); cursor: default; }
			.foot { margin: 8px 32px 0; font: 400 13px/18px var(--font); color: var(--ink2); text-wrap: pretty; }
			.foot.warn { color: var(--warn); }
			.toggle { flex: none; position: relative; width: 58px; height: 30px; border-radius: 15px; background: var(--off); transition: background-color 0.2s; }
			.toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 34px; height: 26px; border-radius: 13px; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / 0.25); transition: transform 0.2s; }
			.toggle[aria-checked='true'] { background: var(--on); }
			.toggle[aria-checked='true']::after { transform: translateX(20px); }
			.ring { flex: none; width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 2.5px var(--warn); }
			.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--c, currentColor); }

			/* The display. */
			.sch { position: absolute; inset: 0; overflow-y: auto; padding: 66px 16px 128px; scrollbar-width: none; }
			.sch::-webkit-scrollbar { display: none; }
			.lcd { margin: 6px 6px 0; border-radius: 28px; background: var(--lcd); color: var(--lcd-ink); padding: 20px 20px 16px;
				background-image: linear-gradient(155deg, rgb(255 255 255 / 0.09) 0%, rgb(255 255 255 / 0) 38%), linear-gradient(to bottom, rgb(255 255 255 / 0.05), rgb(0 0 0 / 0.08));
				box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.07), inset 0 1px 0 rgb(255 255 255 / 0.12), 0 0 0 6px var(--bezel), 0 0 0 6.75px rgb(0 0 0 / 0.08); }
			:root[data-theme='dark'] .lcd { box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.06), inset 0 1px 0 rgb(255 255 255 / 0.08), 0 0 0 6px var(--bezel), 0 0 0 6.75px rgb(255 255 255 / 0.06); }
			.lcd-top { display: flex; align-items: center; gap: 8px; height: 28px; }
			.tag { height: 28px; padding: 0 10px; border-radius: 8px; background: var(--led); color: #fff; display: inline-flex; align-items: center; gap: 7px; font: 600 15px/20px var(--font); white-space: nowrap; }
			.tag .dot { --c: #fff; }
			.tag.line { background: none; color: var(--lcd-ink); box-shadow: inset 0 0 0 1.5px var(--lcd-ink); }
			.tag.warn { background: none; color: var(--lcd-warn); box-shadow: inset 0 0 0 1.5px var(--lcd-warn); }
			.lcd-batt { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font: 500 15px/20px var(--font); color: var(--lcd-ink2); font-variant-numeric: tabular-nums; white-space: nowrap; }
			.lcd-batt.warn { color: var(--lcd-warn); }
			.lcd-batt .bolt { width: 10px; height: 14px; margin-right: -2px; }
			.lcd-time { margin-top: 28px; font: 600 72px/72px var(--font); font-stretch: 112%; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
			.lcd-time i { font: 500 28px/28px var(--font); font-stretch: 100%; letter-spacing: 0; margin: 0 8px 0 3px; }
			.lcd-time i:last-child { margin-right: 0; }
			.lcd-time.still { color: var(--lcd-ink2); }
			.meter { margin-top: 20px; display: flex; gap: 3px; height: 16px; }
			.meter i { flex: 1; border-radius: 1px; background: var(--lcd-dim); }
			.meter i.on { background: var(--meter); }
			.meter-scale { display: flex; justify-content: space-between; margin-top: 6px; font: 500 11px/14px var(--font); color: var(--lcd-ink2); font-variant-numeric: tabular-nums; }
			.lcd-foot { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--lcd-line); display: flex; justify-content: space-between; gap: 12px; font-size: 15px; line-height: 20px; white-space: nowrap; }
			.lcd-foot span:last-child { color: var(--lcd-ink2); }
			.lcd-foot span.warn { color: var(--lcd-warn); }

			/* Giro 2, palette: X is today; A, B, C give the display an LCD in the light theme and add
			   an accent outside the recording. Red keeps meaning "records". */
			:root[data-pal='a'] .screen { --acc: #d2581a; --acc-lcd: #b84d10; }
			:root[data-pal='a'][data-theme='dark'] .screen { --acc: #ff8a3d; --acc-lcd: #ff8a3d; }
			:root[data-pal='a']:not([data-theme='dark']) .screen { --lcd: #c3cab0; --lcd-ink: #1b2016; --lcd-ink2: #4f5744; --lcd-dim: #afb69b; --lcd-line: #a2a98d; --lcd-warn: #9a5600; }
			:root[data-pal='b'] .screen { --acc: #2a62c9; --acc-lcd: #1f4fa8; }
			:root[data-pal='b'][data-theme='dark'] .screen { --acc: #5c95ff; --acc-lcd: #5c95ff; }
			:root[data-pal='b']:not([data-theme='dark']) .screen { --lcd: #b8c1c3; --lcd-ink: #131b23; --lcd-ink2: #47535e; --lcd-dim: #a3adb0; --lcd-line: #95a0a4; --lcd-warn: #8f4f00; }
			:root[data-pal='c'] .screen { --acc: #1d7a6b; --acc-lcd: #16675a; }
			:root[data-pal='c'][data-theme='dark'] .screen { --acc: #3fbfa9; --acc-lcd: #3fbfa9; }
			:root[data-pal='c']:not([data-theme='dark']) .screen { --lcd: #d8d0b8; --lcd-ink: #241f17; --lcd-ink2: #5c5444; --lcd-dim: #c4bba1; --lcd-line: #b5ab90; --lcd-warn: #8f4f00; }
			/* Where the accent goes: what you touch and what is not the recording. */
			:root[data-pal]:not([data-pal='x']) .screen { --on: var(--acc); --tape-rec: var(--acc); }
			:root[data-pal]:not([data-pal='x']) .tabbar button[aria-current='true'] { color: var(--acc); }
			:root[data-pal]:not([data-pal='x']) .btn,
			:root[data-pal]:not([data-pal='x']) .sheet header button,
			:root[data-pal]:not([data-pal='x']) .nav-btn { color: var(--acc); }
			:root[data-pal]:not([data-pal='x']) .tag.line { color: var(--acc-lcd); box-shadow: inset 0 0 0 1.5px var(--acc-lcd); }
			:root[data-pal]:not([data-pal='x']) .lcd-foot span:last-child:not(.warn) { color: var(--acc-lcd); }
			/* On a light LCD the reflection is quieter and the rim darker, as on a watch face. */
			:root[data-pal]:not([data-pal='x']):not([data-theme='dark']) .lcd {
				background-image: linear-gradient(155deg, rgb(255 255 255 / 0.22) 0%, rgb(255 255 255 / 0) 40%), linear-gradient(to bottom, rgb(0 0 0 / 0.02), rgb(0 0 0 / 0.07));
				box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.1), inset 0 2px 3px rgb(0 0 0 / 0.08), 0 0 0 6px var(--bezel), 0 0 0 6.75px rgb(0 0 0 / 0.08); }

			/* The one key, set into the same aluminium frame: 34 = 28 + 6. */
			.k-well { margin-top: 18px; padding: 6px; border-radius: 34px; background: var(--bezel); }
			.k-btn { width: 100%; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; gap: 10px; font: 600 17px/24px var(--font); color: #fff; background: var(--key); box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.14), inset 0 -1px 0 rgb(0 0 0 / 0.25); }
			.k-btn svg { width: 18px; height: 18px; }
			.k-btn.rec { background: var(--led); }
			.k-btn .recdot { width: 12px; height: 12px; border-radius: 50%; background: #fff; }
			.k-btn:disabled { background: var(--off); color: var(--ink2); box-shadow: none; cursor: default; }
			.sch-hint { margin-top: 10px; text-align: center; font-size: 13px; line-height: 18px; color: var(--ink2); }
			.notice { margin-top: 16px; padding: 14px 16px; border-radius: 20px; background: var(--cell); display: grid; grid-template-columns: 12px 1fr; column-gap: 12px; }
			.notice .ring { margin-top: 5px; }
			.notice b { display: block; font: 600 15px/20px var(--font); }
			.notice p { font-size: 15px; line-height: 20px; color: var(--ink2); text-wrap: pretty; }
			.notice .acts { grid-column: 2; margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
			.sch-day { margin: 28px 8px 0; }
			.sch-day h2, .day-head { display: flex; justify-content: space-between; align-items: baseline; font: 600 22px/28px var(--font); letter-spacing: -0.01em; }
			.sch-day h2 span { font: 400 15px/20px var(--font); letter-spacing: 0; color: var(--ink2); font-variant-numeric: tabular-nums; }
			.marks { position: relative; height: 10px; margin-top: 8px; }
			.marks i { position: absolute; top: 0; width: 0; height: 0; margin-left: -4px; border: 4px solid transparent; border-top: 7px solid var(--ink); border-bottom: 0; }
			.tape { margin-top: 14px; display: flex; gap: 3px; height: 24px; }
			.marks + .tape { margin-top: 2px; }
			.tape.big { height: 32px; }
			.tape i { flex: 1; border-radius: 1px; background: var(--off); }
			.tape i.rec { background: var(--tape-rec); }
			.tape i.now { background: var(--led); }
			.tape-axis { margin: 6px 0 10px; display: flex; justify-content: space-between; font-size: 13px; line-height: 18px; color: var(--ink2); font-variant-numeric: tabular-nums; }
			.day-rows li { display: flex; justify-content: space-between; align-items: center; height: 48px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
			.day-rows li span:last-child { color: var(--ink2); font-size: 15px; }
			.empty { padding: 16px 0 0; font-size: 15px; line-height: 20px; color: var(--ink2); text-wrap: pretty; }

			/* Today. */
			.conv { display: grid; grid-template-columns: 56px 1fr auto 8px; align-items: center; column-gap: 12px; width: 100%; min-height: 60px; font-variant-numeric: tabular-nums; }
			.conv + .conv { border-top: 1px solid var(--line); }
			.conv time { font: 600 17px/24px var(--font); }
			.conv .dur small { display: block; font: 400 13px/18px var(--font); color: var(--ink2); }
			.st { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; line-height: 20px; color: var(--ink2); white-space: nowrap; }
			.st svg { width: 14px; height: 14px; }
			.st.rec { color: var(--ink); }
			.st.rec .dot { --c: var(--led); }
			.st.warn { color: var(--warn); }
			.st .ring { width: 10px; height: 10px; box-shadow: inset 0 0 0 2px var(--warn); }
			.legend { margin: 12px 32px 0; display: flex; gap: 16px; font-size: 13px; line-height: 18px; color: var(--ink2); }
			.legend span { display: inline-flex; align-items: center; gap: 6px; }
			.legend i { width: 3px; height: 12px; border-radius: 1px; background: var(--tape-rec); }
			.legend i.now { background: var(--led); }
			.legend i.mk { width: 0; height: 0; border: 4px solid transparent; border-top: 7px solid var(--ink); border-bottom: 0; border-radius: 0; background: none; }

			/* The small display: device card, conversation card. */
			.lcd.card { margin: 6px 22px 14px; border-radius: 20px; padding: 16px; display: block; width: calc(100% - 44px); text-align: left; }
			.lcd.card .name { display: flex; align-items: baseline; justify-content: space-between; font: 600 22px/28px var(--font); letter-spacing: -0.01em; }
			.lcd.card .name span { font: 500 15px/20px var(--font); letter-spacing: 0; color: var(--lcd-ink2); display: inline-flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
			.lcd.card .name span.warn { color: var(--lcd-warn); }
			.lcd.card p { font-size: 15px; line-height: 20px; color: var(--lcd-ink2); }
			.lcd.card .lab { margin-top: 16px; display: flex; justify-content: space-between; font-size: 15px; line-height: 20px; }
			.lcd.card .lab span:last-child { font-variant-numeric: tabular-nums; color: var(--lcd-ink2); }
			.lcd.card .more { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--lcd-line); font-size: 15px; line-height: 20px; }
			.lcd.card .more .chev { width: 8px; height: 14px; color: var(--lcd-ink2); }
			.lcd.card .big { margin-top: 12px; font: 600 34px/40px var(--font); font-stretch: 112%; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
			.lcd.card .big i { font: 500 17px/24px var(--font); font-stretch: 100%; letter-spacing: 0; margin: 0 6px 0 2px; }
			.ruler { margin-top: 8px; display: flex; gap: 3px; height: 24px; align-items: end; touch-action: none; cursor: pointer; }
			.ruler i { flex: 1; height: 12px; border-radius: 1px; background: var(--lcd-dim); pointer-events: none; }
			.ruler i.past { background: var(--lcd-ink2); }
			.ruler i.at { height: 24px; background: var(--lcd-ink); }
			.ruler.is-off { cursor: default; }
			.ruler.is-off i, .ruler.is-off i.past, .ruler.is-off i.at { height: 12px; background: var(--lcd-dim); }
			.ruler.on-cell { height: 28px; margin: 0 0 14px; gap: 0; justify-content: space-between; }
			.ruler.on-cell i { flex: none; width: 4px; height: 14px; border-radius: 2px; background: var(--off); }
			.ruler.on-cell i.past { background: var(--tape-rec); }
			.ruler.on-cell i.at { height: 28px; background: var(--ink); }
			.ruler.on-cell.is-off i { height: 14px; background: var(--off); }
			.stack { display: block; padding-top: 2px; }
			.stack .row { min-height: 48px; }

			/* Sheets, alerts. */
			.scrim { position: absolute; inset: 0; z-index: 80; background: var(--scrim); }
			.sheet { position: absolute; z-index: 81; left: 8px; right: 8px; bottom: 8px; padding: 8px 0 28px; border-radius: 38px 38px 47px 47px; background: var(--sheet); -webkit-backdrop-filter: blur(24px) saturate(170%); backdrop-filter: blur(24px) saturate(170%); box-shadow: inset 0 0 0 1px var(--glass-rim), inset 0 1px 0 var(--glass-top), 0 10px 40px var(--glass-shadow); animation: rise 0.28s cubic-bezier(0.2, 0.8, 0.2, 1); }
			@keyframes rise { from { transform: translateY(60px); opacity: 0.3; } }
			.sheet .grab { width: 36px; height: 5px; margin: 0 auto 6px; border-radius: 3px; background: var(--ink3); }
			.sheet header { display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 12px 0 24px; }
			.sheet header h2 { font: 600 17px/22px var(--font); }
			.sheet header button { height: 36px; padding: 0 14px; border-radius: 18px; background: var(--pill); font: 600 15px/36px var(--font); }
			.sheet .rows { margin-top: 4px; }
			.sheet .foot { margin-top: 10px; }
			.field { display: block; width: calc(100% - 32px); margin: 4px 16px 0; height: 52px; padding: 0 16px; border-radius: 16px; border: 0; background: var(--cell); font: 400 17px/24px var(--font); outline: 0; box-shadow: inset 0 0 0 1.5px var(--ink); }
			.alert { position: absolute; z-index: 81; left: 45px; right: 45px; top: 50%; transform: translateY(-50%); padding: 22px 16px 16px; border-radius: 34px; background: var(--sheet); -webkit-backdrop-filter: blur(24px) saturate(170%); backdrop-filter: blur(24px) saturate(170%); box-shadow: inset 0 0 0 1px var(--glass-rim), 0 10px 40px var(--glass-shadow); font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; }
			.alert.own { font-family: var(--font); }
			.alert h2 { padding: 0 8px; font-weight: 600; font-size: 17px; line-height: 22px; }
			.alert p { margin-top: 6px; padding: 0 8px; font-size: 15px; line-height: 20px; color: var(--ink2); }
			.alert .acts { margin-top: 18px; display: grid; gap: 8px; }
			.alert .acts button { height: 48px; border-radius: 24px; background: var(--pill); text-align: center; font-weight: 500; font-size: 17px; }
			.alert .acts button.main { background: var(--ink); color: var(--bg); font-weight: 600; }

			/* First launch. */
			.ob { position: absolute; inset: 0; padding: 70px 24px 0; }
			.ob-steps { display: flex; gap: 4px; justify-content: center; }
			.ob-steps i { width: 28px; height: 4px; border-radius: 2px; background: var(--off); }
			.ob-steps i.past { background: var(--tape-rec); }
			.ob-steps i.at { background: var(--ink); }
			.ob-art { margin: 28px -8px 0; }
			.ob-art .lcd { pointer-events: none; }
			.ob h1 { margin-top: 32px; font: 600 34px/40px var(--font); letter-spacing: -0.02em; text-wrap: balance; }
			.ob-art + h1 { margin-top: 36px; }
			.ob .lead { margin-top: 12px; font-size: 17px; line-height: 24px; color: var(--ink2); text-wrap: pretty; }
			.ob .rows { margin: 24px -8px 0; }
			.ob .foot { margin: 8px 8px 0; }
			.ob-acts { position: absolute; left: 24px; right: 24px; bottom: 38px; display: grid; gap: 4px; }
			.btn-main { height: 56px; border-radius: 28px; background: var(--key); color: #fff; text-align: center; font: 600 17px/24px var(--font); box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.14), inset 0 -1px 0 rgb(0 0 0 / 0.25); }
			.btn-main:disabled { background: var(--off); color: var(--ink2); box-shadow: none; cursor: default; }
			.btn-text { height: 48px; text-align: center; font: 500 17px/24px var(--font); color: var(--ink); }
			.ob-pend { margin: 20px -8px 0; height: 236px; border-radius: 28px; background: var(--cell); display: grid; place-items: center; overflow: hidden; }
			.ob-pend img { display: block; width: 300px; height: 300px; margin-top: -40px; }
			.ob-pend.ghost img { filter: grayscale(1); opacity: 0.35; }
			.scan { display: flex; gap: 3px; height: 12px; margin-top: 16px; }
			.scan i { flex: 1; border-radius: 1px; background: var(--off); }
			.scan.run i { animation: scan 1.6s linear infinite; animation-delay: calc(var(--i) * 0.045s); }
			.scan.done i { background: var(--tape-rec); }
			@keyframes scan { 0%, 30%, 100% { background: var(--off); } 10% { background: var(--ink); } }
			.steps3 li { display: grid; grid-template-columns: 24px 1fr; gap: 12px; padding: 12px 0; font-size: 15px; line-height: 20px; }
			.steps3 li + li { border-top: 1px solid var(--line); }
			.steps3 li > span:first-child { font: 600 15px/20px var(--font); color: var(--ink2); font-variant-numeric: tabular-nums; }
			.steps3 b { display: block; font: 600 17px/24px var(--font); }
			.steps3 li div span { color: var(--ink2); }
			.form .row label { flex: none; width: 84px; }
			.form .row input { flex: 1; min-width: 0; height: 52px; border: 0; background: none; outline: 0; font: 400 17px/24px var(--font); color: var(--ink); }
			.form .row input::placeholder { color: var(--ink3); }
			.result { margin: 14px 8px 0; display: grid; grid-template-columns: 14px 1fr; column-gap: 10px; font-size: 15px; line-height: 20px; color: var(--ink2); text-wrap: pretty; }
			.result svg { width: 14px; height: 14px; margin-top: 3px; color: var(--ink); }
			.result .ring { margin-top: 4px; }
			.result b { display: block; font-weight: 600; color: var(--ink); }
			.result.warn b { color: var(--warn); }
			.result .scan { grid-column: 1 / -1; margin-top: 0; }
			.sysalert-preview { margin: 28px 21px 0; padding: 18px 12px 12px; border-radius: 28px; background: var(--cell); font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; }
			.sysalert-preview h4 { padding: 0 8px; font-weight: 600; font-size: 15px; line-height: 20px; }
			.sysalert-preview p { margin-top: 4px; padding: 0 8px; font-size: 13px; line-height: 18px; color: var(--ink2); }
			.sysalert-preview div { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
			.sysalert-preview span { height: 40px; border-radius: 20px; background: var(--pill); text-align: center; font-size: 15px; line-height: 40px; color: var(--ink2); }
			.sysalert-preview span.pick { background: var(--ink); color: var(--bg); font-weight: 600; }

			/* System surfaces, rebuilt by hand. Wallpaper and neighbours are context. */
			.sys { position: absolute; inset: 0; color: #fff; background: linear-gradient(#565a62, #2a2c31 62%, #1b1c1f); font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; }
			.sys .homebar { background: #fff; }
			.sys-clock { position: absolute; top: 86px; left: 0; right: 0; text-align: center; }
			.sys-clock small { display: block; font-size: 22px; line-height: 28px; font-weight: 500; color: rgb(255 255 255 / 0.86); }
			.sys-clock b { display: block; font-size: 100px; line-height: 100px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
			.la { position: absolute; left: 8px; right: 8px; bottom: 124px; padding: 16px 16px 14px; border-radius: 30px; background: var(--lcd); color: var(--lcd-ink); font-family: var(--font); background-image: linear-gradient(155deg, rgb(255 255 255 / 0.09) 0%, rgb(255 255 255 / 0) 38%); box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.08); }
			.la-top { display: flex; align-items: center; gap: 8px; }
			.la-top .who { margin-left: auto; font: 500 13px/18px var(--font); color: var(--lcd-ink2); }
			.la-mid { margin-top: 10px; display: flex; align-items: center; justify-content: space-between; }
			.la-time { font: 600 34px/40px var(--font); font-stretch: 112%; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
			.la-time.still { color: var(--lcd-ink2); }
			.la-key { height: 44px; padding: 0 18px 0 14px; border-radius: 22px; background: var(--lcd-dim); color: #fff; display: inline-flex; align-items: center; gap: 8px; font: 600 15px/20px var(--font); box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.12); }
			.la-key svg { width: 16px; height: 16px; }
			.la-key.rec { background: var(--led); }
			.la-key .recdot { width: 10px; height: 10px; border-radius: 50%; background: #fff; }
			.la-foot { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--lcd-line); display: flex; justify-content: space-between; font: 400 13px/18px var(--font); }
			.la-foot span:last-child { color: var(--lcd-ink2); }
			.la-foot span.warn { color: var(--lcd-warn); }
			.lock-ctl { position: absolute; bottom: 48px; width: 52px; height: 52px; border-radius: 26px; background: rgb(60 62 68 / 0.6); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); display: grid; place-items: center; color: #fff; }
			.lock-ctl svg { width: 24px; height: 24px; }
			.lock-ctl.l { left: 46px; }
			.lock-ctl.r { right: 46px; }
			.lock-ctl.on { background: #fff; color: #e5402f; }
			.isl { position: absolute; z-index: 60; top: 11px; left: 50%; transform: translateX(-50%); height: 37px; border-radius: 19px; background: #000; color: #fff; display: flex; align-items: center; justify-content: space-between; font-family: var(--font); transition: width 0.3s, height 0.3s, border-radius 0.3s; }
			.isl.compact { width: 180px; padding: 0 12px 0 13px; }
			.isl.compact .t { font: 600 15px/20px var(--font); font-variant-numeric: tabular-nums; }
			.isl .bars { display: flex; align-items: center; gap: 2px; height: 16px; }
			.isl .bars i { width: 3px; border-radius: 1.5px; background: #ff5a47; }

			// OGGI.
			const CONV = {

				token: '<div class="result warn" data-n="result"><span class="ring"></span><div><b>Il server ha rifiutato il token</b>L’indirizzo è giusto, il token no. Incollalo di nuovo: deve essere quello creato per l’audio, intero.</div></div>',

						<div style="margin:12px 16px 0"><button class="btn" data-act="ios">Apri Impostazioni</button></div></section>
					<section class="grp"><h3>Centro di Controllo e blocco schermo</h3>
						<div class="rows"><ol class="steps3"><li><span>1</span><div>Apri il Centro di Controllo e tieni premuto su uno spazio vuoto.</div></li><li><span>2</span><div>Tocca Aggiungi un controllo e cerca Pendant.</div></li><li><span>3</span><div>Aggiungi Pausa e ripresa e Segna questo momento. Sul blocco schermo sostituiscono torcia e fotocamera.</div></li></ol></div></section>

				if (now) now.scrollTop = keep;
				const mover = $('[data-scroll], .ob', el);
				if (mover && dir) mover.classList.add(dir === 'push' ? 'page-in' : 'page-back');
				const ok = keyOf({}, sheet) + (sheet?.type === 'pick' ? cfg[sheet.key] : '');
				if (ok !== overKey) { $('#over').innerHTML = renderOver(sheet); overKey = ok; }
				$('[data-phone]').classList.toggle('hold', view.s === 'sys' && view.sys === 'action');
				if (view.s === 'home') lastHs = view.hs;
				const k = keyOf(norm(view), sheet);
				const cur = SC.find((s) => keyOf(norm(s[2]), s[3]) === k);
				$$('[data-scene]').forEach((b) => b.setAttribute('aria-current', String(!!cur && b.dataset.scene === cur[0])));
				if (cur) {
					history.replaceState(null, '', `${location.pathname}${location.search}#${cur[0]}`);
					const group = SCENES.slice(0, SCENES.indexOf(cur)).filter((s) => s.length === 1).pop()[0];
					$('[data-caption]').textContent = note || `${group}: ${cur[1]}`;
					const b = $('[data-scene][aria-current="true"]');
					const idx = $('[data-index]');
					const y = b.offsetTop;
					if (y < idx.scrollTop) idx.scrollTop = y - 8; else if (y + b.offsetHeight > idx.scrollTop + idx.clientHeight) idx.scrollTop = y + b.offsetHeight - idx.clientHeight + 8;
				} else $('[data-caption]').textContent = note || 'Stato raggiunto usando il telefono, non in indice';
				annotate();
				setTimeout(annotate, 320);
			};
			const say = (text) => { note = text; draw(); clearTimeout(say.t); say.t = setTimeout(() => { note = ''; draw(); }, 2600); };
			const open = (v, o = {}) => {
				clearTimers();
				if (o.push) stack.push(view); else if (!o.keep) stack = [];
				sheet = o.sheet || null;
				view = v;
				draw(o.push ? 'push' : o.dir);
			};
			const goScene = (id) => {
				const s = SC.find((x) => x[0] === id);
				if (!s) return false;
				note = '';
				open({ ...s[2] }, { sheet: s[3] ? { ...s[3] } : null });
				return true;
			};
			const parent = (v) => {
				if (v.s === 'page') return v.p === 'licenze' ? page('info') : { s: 'settings' };
				if (v.s === 'conv') return { s: 'today', day: CONV[v.id].day, hs: v.hs || 'rec' };
				return null;
			};
			const back = () => {
				if (sheet) { if (sheet.type === 'alert' && ALERT[sheet.id].sys) return; sheet = null; draw(); return; }
				const to = stack.length ? stack.pop() : parent(view);
				if (!to) return;
				clearTimers();
				view = to;
				draw('pop');
			};
			const obGo = (step) => {
				if (step === 'search') { open(ob('search', { st: 'scan' }), { dir: 'push' }); later(1900, () => { view.st = 'found'; draw(); }); }
				else if (step === 'linking') { view.st = 'linking'; draw(); later(1500, () => { view.st = 'linked'; draw(); }); }
				else if (step === 'server') open(ob('server', { srv: 'empty' }), { dir: 'push' });
				else open(ob(step), { dir: 'push' });
			};
			const act = (name, el) => {
				if (!name) return;
				const [a, b] = name.split(':');
				if (a === 'close') { sheet = null; draw(); }
				else if (a === 'pause') {
					if (view.s === 'home') { const k = HOME[view.hs].key; if (k !== 'dis') { view.hs = k === 'resume' ? 'rec' : 'pause'; draw(); } }
					else { view.hs = view.hs === 'pause' ? 'rec' : 'pause'; draw(); }
				}
				else if (a === 'dismiss') { view.hs = 'rec'; draw(); }
				else if (a === 'ios') say('Nell’app questo tasto apre le Impostazioni di iOS, o l’app Omi.');
				else if (a === 'go') open(page(b), { push: true });
				else if (a === 'pick') { sheet = { type: 'pick', key: b }; draw(); }
				else if (a === 'ask') { sheet = { type: 'alert', id: b }; draw(); }
				else if (a === 'ob') { sheet = null; obGo(b); }
				else if (a === 'home') open(home(b), { dir: 'push' });
				else if (a === 'obtest' || a === 'test') {
					if (a === 'obtest') { const f = $('#f-addr'); if (f && f.value.trim()) cfg.addr = f.value.trim(); }
					view.srv = 'testing'; draw(); later(1400, () => { view.srv = 'ok'; draw(); });
				}
				else if (a === 'vibrate') { el.textContent = 'Vibra'; el.disabled = true; later(500, () => draw()); say('Il ciondolo vibra per 300 ms.'); }
				else if (a === 'drain') say('Legge la memoria del ciondolo e la tratta secondo la scelta qui sopra.');
				else if (a === 'forget' || a === 'reset') { sheet = { type: 'alert', id: a }; draw(); }
				else if (a === 'export') { sheet = { type: 'share' }; draw(); }
				else if (a === 'savetext') {
					const f = $('[data-field]');
					const val = f.value.trim();
					if (val) cfg[f.dataset.field] = f.dataset.field === 'token' ? `••••••••••••${val.slice(-4)}` : val;
					sheet = null; draw();
				}
				else if (a === 'mark') {
					if (view.sys === 'cc') { view.flash = true; draw(); later(1800, () => { view.flash = false; draw(); }); }
					else say('Segnato alle 17:42: il ciondolo vibra, il segnalibro entra nella conversazione in corso.');
				}
				else if (a === 'isl') { view.k = b; draw(); }
			};
			screen.addEventListener('click', (e) => {
				const t = e.target;
				let el;
				if ((el = t.closest('[data-toggle]'))) { cfg[el.dataset.toggle] = !cfg[el.dataset.toggle]; draw(); }
				else if ((el = t.closest('[data-opt]'))) { cfg[sheet.key] = el.dataset.opt; sheet = null; draw(); }
				else if ((el = t.closest('[data-act]'))) { if (!el.disabled) act(el.dataset.act, el); }
				else if ((el = t.closest('[data-pick]'))) { sheet = { type: 'pick', key: el.dataset.pick }; draw(); }
				else if ((el = t.closest('[data-text]'))) { sheet = { type: 'text', key: el.dataset.text }; draw(); $('[data-field]')?.focus(); }
				else if ((el = t.closest('[data-go]'))) {
					const [a, b] = el.dataset.go.split(':');
					open(a === 'conv' ? { s: 'conv', id: b, hs: view.hs } : page(a), { push: true });
				}
				else if (t.closest('[data-back]')) back();
				else if ((el = t.closest('[data-tab]'))) open(el.dataset.tab === 'home' ? home(lastHs) : el.dataset.tab === 'today' ? { s: 'today', day: 'oggi', hs: lastHs === 'queue' ? 'queue' : 'rec' } : { s: 'settings' });
				else if ((el = t.closest('[data-day]')) && !el.disabled) {
					const d = Number(el.dataset.day);
					const i = d === 2 ? 2 : DAY_ORDER.indexOf(view.day) + d;
					open({ s: 'today', day: DAY_ORDER[i], hs: 'rec' }, { dir: d < 0 ? 'pop' : 'push' });
				}
			});

			// First launch: the test button wakes up when both fields are filled.
			screen.addEventListener('input', (e) => {
				if (!e.target.closest('.form')) return;
				const b = $('[data-act="obtest"]');
				if (b) b.disabled = !($('#f-addr').value.trim() && $('#f-token').value.trim());
			});

			// The tick ruler: drag or arrows.
			let drag = null;
			const setRuler = (key, x) => {
				const el = $(`[data-ruler="${key}"]`);
				if (!el) return;
				const r = el.getBoundingClientRect();
				const n = el.children.length - 1;
				const i = Math.max(0, Math.min(n, Math.round(((x - r.left) / r.width) * n)));
				const val = Math.round((i / n) * Number(el.dataset.max));
				if (val !== cfg[key]) { cfg[key] = val; draw(); }
			};
			screen.addEventListener('pointerdown', (e) => {
				const el = e.target.closest('[data-ruler]');
				if (!el) return;
				drag = el.dataset.ruler;
				setRuler(drag, e.clientX);
				e.preventDefault();
			});
			addEventListener('pointermove', (e) => { if (drag) setRuler(drag, e.clientX); });
			addEventListener('pointerup', () => { drag = null; });
			screen.addEventListener('keydown', (e) => {
				const el = e.target.closest?.('[data-ruler]');
				if (!el || !['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
				const key = el.dataset.ruler;
				const max = Number(el.dataset.max);
				const step = max / (el.children.length - 1);
				cfg[key] = Math.round(Math.max(0, Math.min(max, cfg[key] + (e.key === 'ArrowRight' ? step : -step))));
				draw();
				$(`[data-ruler="${key}"]`)?.focus();
				e.preventDefault();
				e.stopPropagation();
			});

			// Annotations.
			function annotate() {
				const layer = $('[data-anno-layer]');
				const list = $('[data-notes]');
				if (document.body.dataset.anno !== 'on') { layer.innerHTML = ''; return; }
				const sr = screen.getBoundingClientRect();
				let n = 0;
				let boxes = '';
				let items = '';
				for (const [q, title, text] of notesFor(view, sheet)) {
					const el = $(q, screen);
					if (!el) continue;
					const r = el.getBoundingClientRect();
					if (!r.width || !r.height) continue;
					n += 1;
					const top = Math.max(r.top - sr.top, 2);
					const bottom = Math.min(r.bottom - sr.top, 842);
					if (bottom - top > 4) boxes += `<div data-box="${n}" style="left:${r.left - sr.left - 3}px;top:${top - 3}px;width:${r.width + 6}px;height:${bottom - top + 6}px"><b>${n}</b></div>`;
					items += `<li data-item="${n}"><b>${n}</b><div><strong>${title}</strong>${text}</div></li>`;
				}
				layer.innerHTML = boxes;
				const dark = root.dataset.theme === 'dark';
				const TOK = [['Fondo', '#e4e5e2', '#141518'], ['Celle', '#f1f1ef', '#1d1f23'], ['Inchiostro', '#15171b', '#ecedef'], ['Grigio testo', '#5b6068', '#9a9ea6'], ['Grigio chiaro (chevron, disabilitato)', '#a5a9b0', '#555961'], ['Filo', '#dfe0dc', '#2a2c31'], ['Spento (tacche vuote, toggle)', '#d2d3cf', '#2a2c30'], ['Display', '#2b2e34', '#23262b'], ['Inchiostro del display', '#f1f2f4', '#eceef1'], ['Secondario del display', '#a9aeb7', '#9ba0a9'], ['Tacche spente del display', '#3d4149', '#34383f'], ['Righe del display', '#464a53', '#3a3e45'], ['Cornice d’alluminio', '#cfd0cc', '#2c2f34'], ['Tasto Pausa', '#2b2e34', '#3a3e46'], ['Rosso', '#e5402f', '#ff5a47'], ['Livello acceso', '#ff5a47', '#ff5a47'], ['Tratti registrati', '#7c818a', '#6f757f'], ['Avvisi', '#9a5600', '#f0a840'], ['Avvisi sul display', '#f0a840', '#f0a840'], ['Toggle acceso', '#15171b', '#7d8594']];
				list.innerHTML = `<h2>Annotazioni</h2><ol>${items}</ol>
					<details><summary>Token di colore, tema ${dark ? 'scuro' : 'chiaro'}</summary><table>${TOK.map(([name, l, d]) => `<tr><td><i style="background:${dark ? d : l}"></i>${name}</td><td><code>${dark ? d : l}</code></td></tr>`).join('')}</table></details>
					<details><summary>Scala e misure</summary><table>
						<tr><td>Testo</td><td>11, 13, 15, 17, 22, 34, 72 (unità 28)</td></tr><tr><td>Pesi</td><td>400, 500, 600</td></tr><tr><td>Larghezza</td><td>112% sulle cifre del display, 100% altrove</td></tr>
						<tr><td>Spazi</td><td>multipli di 4: 4, 8, 12, 16, 20, 24, 28, 32</td></tr><tr><td>Margini</td><td>16 celle, 24 titoli, 32 intestazioni e piedi</td></tr>
						<tr><td>Raggi</td><td>schermo 55; display 28 più cornice 6; tasto 28; celle 20; foglio 38 e 47; capsule piene</td></tr><tr><td>Bersagli</td><td>almeno 44 (le capsule alte 36 allargano l’area con contentShape); righe 52; tasto 56</td></tr></table></details>`;
			}
			screen.addEventListener('scroll', () => annotate(), true);
			addEventListener('resize', () => annotate());
			$('[data-notes]').addEventListener('mouseover', (e) => {
				const li = e.target.closest('[data-item]');
				$$('[data-box]').forEach((b) => b.classList.toggle('hot', !!li && b.dataset.box === li.dataset.item));
			});

			// Chrome.
			const KEY = `concept:${location.pathname}`;
			const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { return {}; } };
			const save = (s) => { try { localStorage.setItem(KEY, JSON.stringify({ ...load(), ...s })); } catch { /* storage is a convenience */ } };
			const setTheme = (t) => { root.dataset.theme = t; save({ theme: t }); annotate(); };
			const setAnno = (on) => { document.body.dataset.anno = on ? 'on' : 'off'; $('[data-anno-toggle]').setAttribute('aria-pressed', String(on)); save({ anno: on }); annotate(); };
			const toggleChrome = () => { document.body.dataset.chrome = document.body.dataset.chrome === 'off' ? 'on' : 'off'; annotate(); };
			$('[data-theme-toggle]').addEventListener('click', () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'));
			$('[data-anno-toggle]').addEventListener('click', () => setAnno(document.body.dataset.anno !== 'on'));
			$('[data-chrome-toggle]').addEventListener('click', toggleChrome);
			$('[data-index]').addEventListener('click', (e) => { const b = e.target.closest('[data-scene]'); if (b) goScene(b.dataset.scene); });
			const step = (d) => {
				const cur = $('[data-scene][aria-current="true"]');
				const i = cur ? SC.findIndex((s) => s[0] === cur.dataset.scene) : -1;
				goScene(SC[(i + d + SC.length) % SC.length][0]);
			};
			// Giro 2: palette.
			const PAL = {
				x: 'oggi: display grafite in tutti e due i temi, nessun accento fuori dal rosso',
				a: 'Casio: LCD verde-grigio nel chiaro, accento arancio sui comandi e sullo stato di riposo',
				b: 'G-Shock: LCD grigio-azzurro nel chiaro, accento blu',
				c: 'Carta: LCD caldo nel chiaro, accento verde petrolio'
			};
			$('[data-pals]').innerHTML = Object.keys(PAL).map((v) => `<button data-pal="${v}"><kbd>${v}</kbd> ${PAL[v].split(':')[0]}</button>`).join(' ');
			const setPal = (v) => {
				if (!PAL[v]) return;
				root.dataset.pal = v;
				$$('[data-pal]').forEach((b) => b.tagName === 'BUTTON' && b.setAttribute('aria-pressed', String(b.dataset.pal === v)));
				$('.bar p').textContent = PAL[v];
				save({ pal: v });
				annotate();
			};
			$('[data-pals]').addEventListener('click', (e) => { const b = e.target.closest('[data-pal]'); if (b) setPal(b.dataset.pal); });
			addEventListener('keydown', (e) => {
				if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest('input, textarea, select')) return;
				const k = e.key.toLowerCase();
				if (PAL[k]) setPal(k);
				else if (k === 't') setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
				else if (k === 'i') setAnno(document.body.dataset.anno !== 'on');
				else if (k === 'p') toggleChrome();
				else if (k === 'escape') back();
				else if (k === 'arrowdown' || k === 'arrowright') { step(1); e.preventDefault(); }
				else if (k === 'arrowup' || k === 'arrowleft') { step(-1); e.preventDefault(); }
			});
			addEventListener('hashchange', () => { const id = location.hash.slice(1); if ($('[data-scene][aria-current="true"]')?.dataset.scene !== id) goScene(id); });

			// The clock runs while recording: it is the content, so it runs with reduced motion too.
			setInterval(() => {
				tick += 1;
				$$('[data-fmt]').forEach((el) => { el.innerHTML = FMT[el.dataset.fmt](Number(el.dataset.base) + tick); });
			}, 1000);
			// The level follows the voice; still with reduced motion.
			let level = 21;
			setInterval(() => {
				if (still.matches) return;
				level = Math.max(6, Math.min(33, level + Math.round((Math.random() - 0.5) * 12)));
				$$('[data-meter]').forEach((m) => [...m.children].forEach((el, i) => el.classList.toggle('on', i < level)));
			}, 160);

			root.dataset.theme = load().theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
			document.body.dataset.anno = load().anno ? 'on' : 'off';
			$('[data-anno-toggle]').setAttribute('aria-pressed', String(!!load().anno));
			if (!goScene(location.hash.slice(1))) goScene('adesso-registra');
			setPal(load().pal || 'a');
		</script>
	</body>
</html>
