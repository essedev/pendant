<!doctype html>
<html lang="it">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Concept A - App</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Schibsted+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=Albert+Sans:wght@300;400;500;600&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
		<!--
			Concept A: cosa sta al centro dell'app Pendant e come si arriva alle impostazioni.
			Tasti: lettera per la variante, t tema, s cambia lo stato (registra, in pausa, ciondolo
			scollegato, Nexus non risponde), p nasconde la barra.

			Il problema: l'app di oggi è la schermata di verifica di M5-M6, un elenco tecnico
			(contatori, prove, log) senza impostazioni. Serve una vera app, con le impostazioni della
			configurazione (ARCHITECTURE #Configurazione) modificabili dal telefono.

			X  oggi: la schermata di verifica, List di SwiftUI su iOS 18, senza vetro.
			A  Strumento: l'app è un telecomando; la apri per vedere se registra e cambiarlo. Stato
			   enorme al centro, pulsante pausa di vetro sopra l'onda dell'audio dal vivo.
			B  Diario: conta sapere cosa è stato catturato, non comandare (il comando è il doppio
			   tocco). La giornata come linea del tempo, lo stato in una striscia di vetro in alto.
			C  Nativa: zero novità, si usa come Impostazioni di iOS. Scheda di stato in cima, poi
			   righe che aprono una pagina ciascuna; home e impostazioni sono la stessa lista.

			Tutte su iOS 26 col Liquid Glass (l'iPhone è su iOS 27.2): il vetro sta sullo strato dei
			comandi (barra in basso, barre di navigazione, pulsanti fluttuanti), mai sul contenuto.
			Le impostazioni sono lo stesso catalogo nelle tre: cambia solo come ci si arriva.

			Mappatura sul codice di oggi (fattibilità, non piano): stato da CaptureController,
			StreamUplink e DeviceLink, che lo espongono già. Le impostazioni sono i campi di
			Configuration più quelli in arrivo (note M9, offline M8, notifiche M7). Nuovo: salvare la
			configurazione in Nexus e leggerla dall'app (M7), lo storico delle conversazioni del
			giorno (da Nexus, audio_session), il livello dell'audio (si calcola dal PCM decodificato).
			Il target dell'app passa da iOS 18 a iOS 26 per avere il vetro.
			Il vetro qui è una sfocatura con riflessi (backdrop-filter): la rifrazione vera di
			SwiftUI, che piega il contenuto ai bordi, l'HTML non la fa.

			Dati: veri quelli di oggi (firmware 3.0.21, batteria 84%, la conversazione delle 17:21 di
			4 min 47 s, server.example.com, 53 pacchetti in memoria, scadenza della firma il 3/12).
			Inventati, plausibili: le conversazioni del mattino, la nota delle 15:02 (le note arrivano
			con M9), i minuti nei vari stati.

			Giro 2: A come base, ma il font di sistema non convince e il pulsante enorme nemmeno. Tre
			sottovarianti con la struttura di A e un carattere ciascuna; al centro l'indicatore, la
			pausa diventa una capsula di vetro di misura normale. A resta per confronto.
			a1 Quadrante: uno strumento di misura. IBM Plex Sans e Plex Mono, tacche da VU meter
			   intorno al tempo, fondo nero o bianco carta millimetrata. Vetro solo sui comandi.
			a2 Carta: un registratore da taccuino. Newsreader per stato e titoli, Plex Mono per i
			   dati, crema con grana, la traccia dell'audio come un sismografo. Vetro lattiginoso.
			a3 Aurora: iOS 26 al massimo. Font arrotondato di sistema (SF Pro Rounded; nel mock
			   Nunito al suo posto, perché Chromium non ha ui-rounded), un gradiente che respira col
			   livello dell'audio e cambia tinta con lo stato. Vetro su tutti i comandi.
			Font: Plex, Newsreader e Nunito sono OFL e si includono nell'app (UIAppFonts); SF Pro
			Rounded è già nel sistema (.fontDesign(.rounded)). Il gradiente di a3 in SwiftUI è un
			MeshGradient animato col livello.

			Giro 3: "non ci siamo, stili più ragionati, niente slop, eleganti"; icona delle
			impostazioni sbagliata (sembrava un sole: ora è un ingranaggio). Riletti a1-a3 col
			catalogo di deslop: a1 griglia decorativa, etichette in maiuscolo spaziato, numero gigante
			con etichetta; a2 crema, serif corsivo enorme e rosso mattone (il cliché più noto); a3
			palette viola-arancio da AI, vetro come decorazione, testo bianco su colore. Restano solo per
			confronto. Le nuove partono dal soggetto, con la struttura di A e un'idea ciascuna:
			D  Gioiello: il ciondolo è un disco di metallo da 25 mm che porti al collo. Al centro c'è
			   lui, in acciaio spazzolato col LED vero, e lo stato inciso lungo il bordo come la
			   lunetta di un orologio. Jost (geometrico alla Futura, la famiglia dei quadranti),
			   pesi leggeri, numeri sottili. Porcellana fredda e grafite, smalto rosso solo per
			   "registra", blu smalto per le selezioni. Niente etichette in maiuscolo.
			   Token: porcellana #ECEDEF, grafite #2B2D31, acciaio #A7ABB1, smalto rosso #A3271F,
			   smalto blu #23395B; scuro: brunito #141518.
			E  Voce: l'app dice in una frase quello che sta facendo, come lo diresti tu. La frase è
			   l'elemento che si ricorda, allineata a sinistra; sotto, una sola linea che si
			   ispessisce con la voce (il livello è una sottolineatura). Atkinson Hyperlegible Next,
			   disegnato per leggersi di colpo: è un'app che si guarda di sfuggita.
			   Token: nebbia #E9ECE8, ardesia #1E2A2D, salvia #56656A, brace #B8402A (solo per la
			   registrazione), salvia scura #2F6B5E per le selezioni; scuro: #121816.
			F  Nexus: l'app è il capo tascabile di Nexus, quindi ne prende l'identità invece di
			   inventarne una: bianco pieno, inchiostro freddo, bordi a filo al posto delle ombre,
			   arancio Nexus per "registra", Geist e Geist Mono (il canone di Nexus, per questo qui
			   è accettato nonostante sia un font molto usato). Al centro l'attività degli ultimi
			   60 secondi, a barre: un dato, non una decorazione.
			In tutte e tre il vetro sta solo sulla barra in basso e sul pulsante pausa, che sono
			comandi sopra il contenuto.

			Giro 4: l'app è a sé stante e il server è configurabile, quindi niente "Nexus" nei testi
			(Server, con indirizzo, token e protocollo nelle impostazioni, che stanno sul telefono).
			a1-a3 tolti. Tre direzioni nuove dalla tavola d'ispirazione (inspo/index.html) e dal
			render del ciondolo (inspo/omi-pendant.png, immagine di Omi, non versionata).
			Dall'oggetto: scocca di acrilico fumé grigio-blu, centro in grafite, un solo colore vivo,
			il blu del LED. Quel blu diventa il colore di "registra" al posto del rosso: è la luce
			che hai sul petto.
			Token comuni: acrilico #D6DCE5 (chiaro) e #1C2230 (scuro), grafite #3A3B3E, LED #3157E8
			(#6F8DFF sullo scuro).
			G  Display: dai registratori (yuhang) e dallo svizzero (ios-02). Un solo "display"
			   dello stato, in acrilico fumé, col punto LED, il tempo con le unità piccole
			   (4m47s) e il livello come una fila di tacche; sotto, righe svizzere allineate a
			   sinistra. Schibsted Grotesk.
			H  Giornata: da Plot (ios-01) e Murmur (voice-07). Lo stato in una riga in cima, col
			   tempo a destra; sotto, la giornata in una tavola scura: le ore registrate come
			   tratti blu su una linea dalle 8 alle 20, il tratto in corso che cresce. Hanken
			   Grotesk.
			I  Oggetto: il ciondolo vero appeso dall'alto dello schermo, col cordino che scende dalla
			   barra di stato; il LED nel render cambia con lo stato (blu, spento, ambra). Sotto, lo
			   stato in una pillola di vetro e righe in acrilico fumé. Albert Sans, pesi leggeri.
			   Rischio dichiarato: fondo nero con un solo accento è uno dei default; qui è il fondo
			   del render e l'accento è il LED del ciondolo, quindi viene dall'oggetto.

			Scelta (26/11/2026): nessuna variante di questo file; il design scelto è la L di
			concept-a-app-fable.html (giri 5-12). Questo file resta come storia dei giri 1-4.
		-->
		<style>
			:root {
				--bg: #f2f2f7;
				--cell: #ffffff;
				--label: #000000;
				--secondary: rgb(60 60 67 / 0.6);
				--tertiary: rgb(60 60 67 / 0.3);
				--separator: rgb(60 60 67 / 0.18);
				--fill: rgb(120 120 128 / 0.16);
				--blue: #007aff;
				--red: #ff3b30;
				--green: #34c759;
				--orange: #ff9500;
				--indigo: #5856d6;
				--teal: #30b0c7;
				--gray: #8e8e93;
				--glass: rgb(255 255 255 / 0.55);
				--glass-edge: rgb(255 255 255 / 0.75);
				--glass-shadow: 0 8px 28px rgb(0 0 0 / 0.12);
				--sans: system-ui, -apple-system, 'SF Pro Text', sans-serif;
				--mono: ui-monospace, 'SF Mono', Menlo, monospace;
			}
			:root[data-theme='dark'] {
				--bg: #000000;
				--cell: #1c1c1e;
				--label: #ffffff;
				--secondary: rgb(235 235 245 / 0.6);
				--tertiary: rgb(235 235 245 / 0.3);
				--separator: rgb(84 84 88 / 0.6);
				--fill: rgb(120 120 128 / 0.32);
				--blue: #0a84ff;
				--red: #ff453a;
				--green: #30d158;
				--orange: #ff9f0a;
				--indigo: #5e5ce6;
				--teal: #40c8e0;
				--gray: #98989d;
				--glass: rgb(44 44 48 / 0.5);
				--glass-edge: rgb(255 255 255 / 0.16);
				--glass-shadow: 0 8px 28px rgb(0 0 0 / 0.5);
			}
			* { box-sizing: border-box; }
			html, body { margin: 0; }
			body { min-height: 100vh; background: #d9d9de; color: var(--label); font: 15px/1.35 var(--sans); }
			:root[data-theme='dark'] body { background: #2a2a2c; }
			[hidden] { display: none !important; }
			button { font: inherit; color: inherit; }

			/* Concept chrome. */
			.switch { position: sticky; top: 0; z-index: 100; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px; background: #111; color: #aaa; font: 12px/1.4 var(--mono); }
			.switch button { font: inherit; border: 0; padding: 5px 9px; border-radius: 6px; background: #262626; color: #eee; cursor: pointer; }
			.switch button[aria-pressed='true'] { background: #eee; color: #111; }
			.switch p { margin: 0 0 0 8px; flex: 1 1 240px; min-width: 0; }
			body[data-chrome='off'] .switch { display: none; }

			/* Stage: two phones, home and settings. */
			.stage { display: flex; flex-wrap: wrap; justify-content: center; gap: 40px; padding: 32px 16px 48px; }
			.shot { display: grid; gap: 10px; justify-items: center; }
			.shot > figcaption { font: 12px/1.3 var(--mono); color: #555; }
			:root[data-theme='dark'] .shot > figcaption { color: #aaa; }
			.phone { position: relative; width: 390px; height: 844px; border-radius: 56px; padding: 10px; background: #1a1a1c; box-shadow: 0 0 0 2px #3a3a3e, 0 30px 60px rgb(0 0 0 / 0.25); }
			.screen { position: relative; height: 100%; border-radius: 46px; overflow: hidden; background: var(--bg); }
			.scroll { position: absolute; inset: 0; overflow-y: auto; padding: 54px 0 120px; scrollbar-width: none; }
			.scroll::-webkit-scrollbar { display: none; }
			.island { position: absolute; z-index: 30; top: 11px; left: 50%; width: 120px; height: 34px; margin-left: -60px; border-radius: 17px; background: #000; }
			.statusbar { position: absolute; z-index: 25; top: 0; left: 0; right: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0 42px; font-weight: 600; font-size: 16px; }
			.statusbar .icons { display: flex; gap: 6px; align-items: center; }
			.homebar { position: absolute; z-index: 30; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--label); opacity: 0.85; }

			/* Glass: the controls layer only. Same light edge all round, on every glass surface. */
			.glass { background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%); box-shadow: inset 0 0 0 0.75px var(--glass-edge), inset 0 1px 1px rgb(255 255 255 / 0.25), var(--glass-shadow); }

			/* Tab bar, iOS 26: a floating glass capsule. The selected tab is a lighter pill. */
			.tabbar { position: absolute; z-index: 20; left: 20px; right: 20px; bottom: 28px; height: 62px; border-radius: 31px; display: flex; padding: 4px; }
			.tabbar button { flex: 1; border: 0; background: none; border-radius: 27px; display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 10px; font-weight: 600; color: var(--label); cursor: pointer; }
			.tabbar button svg { width: 24px; height: 24px; }
			.tabbar button[aria-current='true'] { background: var(--fill); color: var(--blue); }

			/* Grouped lists, shared by settings and by C. */
			.title { margin: 6px 20px 8px; font-size: 34px; font-weight: 700; letter-spacing: 0.01em; }
			.subtitle { margin: -6px 20px 14px; color: var(--secondary); font-size: 15px; }
			.group { margin: 0 16px 22px; }
			.group > h3 { margin: 0 16px 6px; font-size: 13px; font-weight: 400; text-transform: uppercase; color: var(--secondary); letter-spacing: 0.02em; }
			.group > .rows { background: var(--cell); border-radius: 26px; overflow: hidden; }
			.group > footer { margin: 6px 16px 0; font-size: 13px; color: var(--secondary); }
			.row { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; position: relative; }
			.row + .row::before { content: ''; position: absolute; top: 0; right: 0; left: 16px; height: 0.5px; background: var(--separator); }
			.row.with-icon + .row::before, .with-icon + .row.with-icon::before { left: 58px; }
			.row .main { flex: 1; min-width: 0; padding: 11px 0; }
			.row .main small { display: block; color: var(--secondary); font-size: 13px; }
			.row .value { color: var(--secondary); white-space: nowrap; }
			.row .chev { color: var(--tertiary); font-weight: 600; }
			.row.button { color: var(--blue); cursor: pointer; }
			.icon { flex: none; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; }
			.icon svg { width: 18px; height: 18px; }
			.toggle { flex: none; width: 51px; height: 31px; border-radius: 16px; background: var(--fill); position: relative; border: 0; cursor: pointer; transition: background 0.2s; }
			.toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgb(0 0 0 / 0.2); transition: transform 0.2s; }
			.toggle[aria-checked='true'] { background: var(--green); }
			.toggle[aria-checked='true']::after { transform: translateX(20px); }
			.slider { flex: 1; accent-color: var(--blue); }
			.sync { display: flex; align-items: center; gap: 8px; margin: 0 20px 16px; font-size: 13px; color: var(--secondary); }
			.sync svg { width: 16px; height: 16px; }

			/* State colours: red only means recording, orange means something needs a look. */
			.tone-rec { --tone: var(--red); }
			.tone-pause { --tone: var(--gray); }
			.tone-warn { --tone: var(--orange); }
			.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--tone); flex: none; }
			.tone-rec .dot { animation: pulse 1.6s ease-in-out infinite; }
			@keyframes pulse { 50% { opacity: 0.35; } }

			/* X: today's probe screen, iOS 18 list, no glass. */
			.x-nav { margin: 0 20px 10px; font-size: 34px; font-weight: 700; }
			.x .group > .rows { border-radius: 10px; }
			.x .row { min-height: 44px; }

			/* A Strumento. */
			.a-wrap { position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr auto auto; padding: 66px 20px 112px; }
			.a-head { display: flex; justify-content: space-between; align-items: baseline; }
			.a-head b { font-size: 17px; }
			.a-head span { color: var(--secondary); font-size: 13px; font-family: var(--mono); }
			.a-center { position: relative; display: grid; place-items: center; align-content: center; gap: 6px; }
			.a-pad { position: relative; width: 100%; display: grid; place-items: center; margin-top: 28px; }
			.wave { position: absolute; left: -20px; right: -20px; top: 50%; height: 170px; margin-top: -85px; display: flex; align-items: center; justify-content: center; gap: 4px; opacity: 0.55; }
			.wave i { width: 4px; border-radius: 2px; background: var(--tone); height: 8%; }
			.tone-rec .wave i { animation: bar 1.1s ease-in-out infinite; }
			@keyframes bar { 0%, 100% { height: 8%; } 50% { height: var(--h); } }
			.a-state { position: relative; font-size: 40px; font-weight: 700; color: var(--tone); }
			.a-detail { position: relative; color: var(--secondary); font-size: 15px; text-align: center; }
			.a-timer { position: relative; font: 600 52px/1 var(--mono); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
			.a-big { position: relative; width: 132px; height: 132px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; color: var(--label); }
			.a-big svg { width: 48px; height: 48px; }
			.a-chips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
			.a-chip { border-radius: 22px; padding: 12px 14px; display: grid; gap: 2px; }
			.a-chip small { color: var(--secondary); font-size: 12px; }
			.a-chip b { font-size: 15px; display: flex; align-items: center; gap: 6px; }
			.a-today { text-align: center; color: var(--secondary); font-size: 14px; }

			/* B Diario. */
			.b-strip { position: absolute; z-index: 20; top: 56px; left: 12px; right: 12px; height: 52px; border-radius: 26px; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 16px; }
			.b-strip .text { flex: 1; min-width: 0; font-size: 14px; }
			.b-strip .text b { display: block; font-size: 15px; }
			.b-strip .text span { color: var(--secondary); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
			.b-strip button { flex: none; height: 40px; padding: 0 16px; border-radius: 20px; border: 0; background: var(--fill); font-weight: 600; cursor: pointer; }
			.b-scroll { padding-top: 120px; }
			.b-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 16px 20px; }
			.b-sum div { background: var(--cell); border-radius: 18px; padding: 10px 12px; }
			.b-sum b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
			.b-sum small { color: var(--secondary); font-size: 12px; }
			.tl { margin: 0 16px; position: relative; }
			.tl-item { display: grid; grid-template-columns: 48px 1fr; gap: 10px; margin-bottom: 10px; }
			.tl-time { font: 13px/1.2 var(--mono); color: var(--secondary); padding-top: 12px; text-align: right; font-variant-numeric: tabular-nums; }
			.tl-card { background: var(--cell); border-radius: 18px; padding: 11px 14px; }
			.tl-card b { font-size: 15px; }
			.tl-card p { margin: 3px 0 0; color: var(--secondary); font-size: 13px; }
			.tl-card .meta { display: flex; gap: 8px; align-items: center; margin-top: 6px; font-size: 12px; }
			.badge { padding: 2px 8px; border-radius: 10px; font-weight: 600; font-size: 11px; background: var(--fill); color: var(--secondary); }
			.badge.ok { color: var(--green); }
			.badge.run { color: var(--blue); }
			.tl-event { padding: 8px 2px; color: var(--secondary); font-size: 13px; display: flex; gap: 8px; align-items: center; }
			.tl-event svg { width: 15px; height: 15px; flex: none; }
			.tl-card.live { box-shadow: inset 0 0 0 1.5px var(--red); }

			/* C Nativa. */
			.c-status { margin: 0 16px 22px; background: var(--cell); border-radius: 26px; padding: 16px; display: grid; gap: 12px; }
			.c-status .top { display: flex; align-items: center; gap: 10px; }
			.c-status .top b { font-size: 20px; flex: 1; }
			.c-status .top span { font: 15px var(--mono); color: var(--secondary); font-variant-numeric: tabular-nums; }
			.c-status p { margin: 0; color: var(--secondary); font-size: 14px; }
			.c-status .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
			.c-status .facts div { background: var(--bg); border-radius: 14px; padding: 8px 10px; }
			.c-status .facts b { display: block; font-variant-numeric: tabular-nums; }
			.c-status .facts small { color: var(--secondary); font-size: 12px; }
			.c-fab { position: absolute; z-index: 20; left: 50%; bottom: 30px; transform: translateX(-50%); height: 54px; padding: 0 26px; border-radius: 27px; border: 0; display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 17px; cursor: pointer; }
			.c-fab svg { width: 20px; height: 20px; }
			.navbar { position: absolute; z-index: 20; top: 54px; left: 0; right: 0; height: 52px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 17px; }
			.navbar .back { position: absolute; left: 12px; height: 40px; width: 40px; border-radius: 20px; display: grid; place-items: center; color: var(--label); }
			.navbar .back svg { width: 18px; height: 18px; }

			/* Round 3. Shared: each direction sets its tokens on the screen and its font on everything in it. */
			body[data-v='d'] .screen, body[data-v='e'] .screen, body[data-v='f'] .screen { font-family: var(--font); }

						</div>
						<div class="e-lines">
							<p${state === 'off' ? ' class="warn"' : ''}>${state === 'off' ? 'Ciondolo fuori portata.' : 'Ciondolo collegato, batteria all’84%.'}</p>
							<p class="r-today">Oggi hai registrato 1 ora e 36 minuti in 3 conversazioni. <a>Vedi</a></p>
						</div>
					</div>${tabbar('live', A_TABS)}`,
					settings: settingsScreen(A_TABS, 'set'),
					captions: ['E, scheda Registra', 'E, scheda Impostazioni']
				};
			};

			// F: Nexus identity; the center is real data, the last minute of voice activity.
			const renderF = () => {
				const s = STATES[state];
				const live = state === 'rec' || state === 'nexus';
				const bars = Array.from({ length: 60 }, (_, i) => {
					const h = live ? 8 + Math.round(88 * Math.abs(Math.sin(i * 0.37) * Math.cos(i * 0.11))) * (i % 13 < 2 ? 0.1 : 1) : state === 'pause' && i < 22 ? 30 + ((i * 17) % 50) : 4;
					return `<i style="height:${Math.max(4, h)}%"></i>`;
				}).join('');
				return {
					home: `${statusBar()}<div class="r-wrap tone-${s.tone}">
						<div class="f-head"><b>Pendant</b><span>3.0.21</span></div>
						<div class="f-main">
							<div class="f-state"><b>${s.title}</b>${s.timer ? `<span>${s.timer}</span>` : ''}</div>
							<p class="f-sub">${VOICE[state].sub}</p>
							<div class="f-chart"><div class="f-bars">${bars}</div><div class="f-axis"><span>60 s fa</span><span>adesso</span></div></div>
							<button class="r-pause glass" data-toggle-pause>${toggleIcon()}${pauseLabel()}</button>
						</div>
						<div>
							<div class="f-panels">
								<div class="f-panel"><span>Ciondolo</span><b>${state === 'off' ? '<span class="dot" style="--tone:var(--orange)"></span>Scollegato' : '<span class="num">84%</span>collegato'}</b></div>
								<div class="f-panel"><span>Server</span><b>${state === 'nexus' ? '<span class="dot" style="--tone:var(--orange)"></span><span class="num">2 min</span>in coda' : 'In linea'}</b></div>
							</div>
							<div class="r-today">Oggi 1 h 36 min in 3 conversazioni. <a>Vedi</a></div>
						</div>
					</div>${tabbar('live', A_TABS)}`,
					settings: settingsScreen(A_TABS, 'set'),
					captions: ['F, scheda Registra', 'F, scheda Impostazioni']
				};
			};

			// Round 4 copy: what the app knows about the recording, said plainly, server-agnostic.
			const SRV = {
				rec: { line: 'Registra', sub: 'Al server da 4 minuti, niente perso.', t: [4, 47] },
				pause: { line: 'In pausa', sub: 'Da 2 minuti. Tocca due volte il ciondolo per riprendere.', t: null },
				off: { line: 'Scollegato', sub: 'Il ciondolo è lontano da 3 minuti. Riprendo appena torna vicino.', t: null },
				nexus: { line: 'Registra', sub: 'Il server non risponde: 2 minuti in coda sul telefono.', t: [6, 12] }
			};
			const ms = (t) => `${t[0]}<span class="units">m</span>${String(t[1]).padStart(2, '0')}<span class="units">s</span>`;
			const serverRow = () => (state === 'nexus' ? 'server.example.com, non risponde' : 'server.example.com');
			const pendantRow = () => (state === 'off' ? 'non collegato' : 'collegato, 84%');

			// G: one display, like a recorder's.
			const renderG = () => {
				const s = STATES[state];
				const c = SRV[state];
				const ticks = Array.from({ length: 40 }, (_, i) => `<i class="${i < 26 ? 'on' : ''}" style="height:${30 + ((i * 37) % 70)}%"></i>`).join('');
				return {
					home: `${statusBar()}<div class="g-wrap tone-${s.tone}">
						<div class="g-head"><b>Pendant</b><span>Omi 3.0.21</span></div>
						<div class="g-display">
							<div class="st"><span class="led"></span>${c.line}</div>
							<div class="g-time">${c.t ? ms(c.t) : '0<span class="units">m</span>00<span class="units">s</span>'}</div>
							<div class="g-ticks">${ticks}</div>
							<p>${c.sub}</p>
						</div>
						<button class="r-pause glass g-pause" data-toggle-pause>${toggleIcon()}${pauseLabel()}</button>
						<div class="rows-s" style="align-self:end">
							<div><span>Ciondolo</span><span>${pendantRow()}</span></div>
							<div><span>Server</span><span>${serverRow()}</span></div>
							<div><span>Oggi</span><span>1 h 36 min in 3 conversazioni <a>Vedi</a></span></div>
						</div>
					</div>${tabbar('live', A_TABS)}`,
					settings: settingsScreen(A_TABS, 'set'),
					captions: ['G, scheda Registra', 'G, scheda Impostazioni']
				};
			};

			// H: the state in one line, the day on a dark plate.
			const renderH = () => {
				const s = STATES[state];
				const c = SRV[state];
				// Hours 8-20 mapped on the track; blocks are the day's conversations.
				const x = (h) => `${((h - 8) / 12) * 100}%`;
				const blocks = [[9.07, 9.78], [11.5, 12.3], [17.35, 17.43]].map(([a, b]) => `<i style="left:${x(a)};width:calc(${x(b)} - ${x(a)})"></i>`).join('');
				const live = state === 'rec' || state === 'nexus' ? `<i class="live" style="left:${x(17.62)};width:calc(${x(17.7)} - ${x(17.62)})"></i>` : '';
				return {
					home: `${statusBar()}<div class="h-wrap tone-${s.tone}">
						<div class="h-line"><span class="led"></span><b>${c.line}</b>${c.t ? `<span class="t">${ms(c.t)}</span>` : ''}</div>
						<p class="h-sub">${c.sub}</p>
						<button class="r-pause glass h-pause" data-toggle-pause>${toggleIcon()}${pauseLabel()}</button>
						<section class="h-plate">
							<h4>Oggi<span>1 h 36 min</span></h4>
							<div class="h-track">${blocks}${live}<b style="left:${x(17.7)}"></b></div>
							<div class="h-axis"><span>8</span><span>11</span><span>14</span><span>17</span><span>20</span></div>
							<div class="h-list">
								<div><span>17:21</span><span>Conversazione</span><span>4 min</span></div>
								<div><span>11:30</span><span>Conversazione</span><span>48 min</span></div>
								<div><span>09:04</span><span>Conversazione</span><span>43 min</span></div>
							</div>
						</section>
						<div class="rows-s">
							<div><span>Ciondolo</span><span>${pendantRow()}</span></div>
							<div><span>Server</span><span>${serverRow()}</span></div>
						</div>
					</div>${tabbar('live', A_TABS)}`,
					settings: settingsScreen(A_TABS, 'set'),
					captions: ['H, scheda Registra', 'H, scheda Impostazioni']
				};
			};

			// I: the pendant itself hangs from the top; its LED shows the state.
			const renderI = () => {
				const s = STATES[state];
				const c = SRV[state];
				return {
					home: `${statusBar()}<div class="i-wrap tone-${s.tone}${state === 'off' ? ' i-off' : ''}">
						<div class="i-stage"><img src="inspo/omi-pendant.png" alt="Il ciondolo Omi" /><span class="i-led"></span></div>
						<div class="i-pill glass"><span class="led"></span>${c.line}${c.t ? `<span class="t">${ms(c.t)}</span>` : ''}</div>
						<p class="i-sub">${c.sub}</p>
						<div class="i-bottom">
							<button class="r-pause glass" data-toggle-pause>${toggleIcon()}${pauseLabel()}</button>
							<div class="i-rows">
								<div><span>Ciondolo</span><span>${pendantRow()}</span></div>
								<div><span>Server</span><span>${serverRow()}</span></div>
								<div><span>Oggi</span><span>1 h 36 min, 3 conversazioni</span></div>
							</div>
						</div>
					</div>${tabbar('live', A_TABS)}`,
					settings: settingsScreen(A_TABS, 'set'),
					captions: ['I, scheda Registra', 'I, scheda Impostazioni']
				};
			};

			const RENDER = { x: renderX, a: renderA, b: renderB, c: renderC, d: renderD, e: renderE, f: renderF, g: renderG, h: renderH, i: renderI };
			const renderAny = (v) => {
				return RENDER[v]();
			};

			const draw = () => {
				const v = document.body.dataset.v;
				const out = renderAny(v);
				document.querySelector('[data-screen="home"]').innerHTML = out.home;
				document.querySelector('[data-screen="settings"]').innerHTML = out.settings;
				document.querySelector('[data-caption="home"]').textContent = out.captions[0];
				document.querySelector('[data-caption="settings"]').textContent = out.captions[1];
				document.querySelector('[data-state-label]').textContent = STATES[state].label;
			};

			const KEY = `concept:${location.pathname}`;
			const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { return {}; } };
			const save = (s) => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} };
			const root = document.documentElement;

			document.querySelector('[data-buttons]').innerHTML = Object.keys(DESC)
				.map((v) => `<button data-v="${v}">${v.toUpperCase()} ${DESC[v].split(':')[0]}</button>`).join(' ');

			const pick = (v) => {
				if (!DESC[v]) return;
				document.body.dataset.v = v;
				document.querySelectorAll('.switch [data-v]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
				document.querySelector('[data-desc]').textContent = DESC[v];
				history.replaceState(null, '', `${location.search}#${v}`);
				draw();
			};
			const setTheme = (t) => { root.dataset.theme = t; save({ ...load(), theme: t }); };
			const cycleState = () => { state = ORDER[(ORDER.indexOf(state) + 1) % ORDER.length]; draw(); };

			document.querySelector('.switch').addEventListener('click', (e) => {
				const b = e.target.closest('[data-v]');
				if (b) pick(b.dataset.v);
			});
			document.querySelector('[data-theme-toggle]').addEventListener('click', () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'));
			document.querySelector('[data-state-toggle]').addEventListener('click', cycleState);
			document.querySelector('.stage').addEventListener('click', (e) => {
				if (e.target.closest('[data-toggle-pause]')) {
					state = state === 'pause' ? 'rec' : 'pause';
					draw();
				}
				const t = e.target.closest('.toggle');
				if (t) t.setAttribute('aria-checked', String(t.getAttribute('aria-checked') !== 'true'));
			});
			addEventListener('keydown', (e) => {
				if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest('input, textarea, select')) return;
				const k = e.key.toLowerCase();
				if (k === 't') setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
				else if (k === 's') cycleState();
				else if (k === 'p') document.body.dataset.chrome = document.body.dataset.chrome === 'off' ? 'on' : 'off';
				else if (/^\d$/.test(k)) pick(`${document.body.dataset.v.replace(/\d+$/, '')}${k}`);
				else pick(k);
			});

			root.dataset.theme = load().theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
			pick(DESC[location.hash.slice(1)] ? location.hash.slice(1) : 'x');
		</script>
	</body>
</html>
