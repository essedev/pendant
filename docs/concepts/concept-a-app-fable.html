		<title>Concept A - App, giro 5</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />

		<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=Figtree:wght@400..700&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet" />
		<!--
			Concept A, giro 5: rilettura critica di G, H, I (giro 4) e tre direzioni rifatte da zero.
			Il mock dei giri 1-4 resta in concept-a-app.html, questo file non lo sostituisce.

			Giro 6: L è la migliore finora; manca un colore d'accento convinto. Pannello di taratura
			(solo su L, in basso a destra): quattro coppie accento e display, ognuna motivata, più un
			accento libero. La riga dei valori si copia. Le coppie:
			1 LED blu: il colore del LED del ciondolo, quello di oggi.
			2 Rosso registrazione: la convenzione di ogni registratore, display grigio neutro.
			3 Verde display: i display retroilluminati dei registratori (voice-02), accento verde.
			4 Grafite: monocromo, nessun colore; lo stato lo dicono forma e testo.
			L'ambra resta riservata agli avvisi (server irraggiungibile), quindi non è fra gli accenti.
			Giro 7: "un colore tipo blu per le superfici e un accento tipo arancione". Due coppie nuove:
			blu sulle superfici (display, tasto pausa, tratti registrati della giornata) e arancio
			solo su ciò che è vivo (livello acceso, punto del tag, segno di adesso). Gli avvisi
			passano dall'ambra al rosso, sempre con forma e frase, per non confondersi con l'arancio.
			5 Blu e arancio: display blu notte con l'inchiostro chiaro, l'arancio che si accende sopra.
			6 Azzurro e arancio: display azzurro con l'inchiostro blu scuro, tasto blu notte.
			Giro 8: "altre coppie, anche diverse". Sei coppie con caratteri diversi, stessa logica
			(una tinta per le superfici, un accento per ciò che è vivo). Niente viola né lime acido,
			che sono i colori dei mock generati. Gli avvisi restano ambra dove l'accento è lontano,
			passano al rosso dove l'accento è giallo o arancio.
			7 Grafite e rosso: apparecchio da studio, superfici antracite, rosso segnale.
			8 Petrolio e giallo: verde-azzurro profondo, accento giallo come una spia.
			9 Bosco e corallo: verde scuro, accento corallo caldo.
			10 Salvia e arancio bruciato: display chiaro grigio-verde, tasto oliva, terroso.
			11 Notte e menta: blu notte, accento menta.
			12 LCD e rosso: il display giallo-verde delle calcolatrici e dei registratori, segmenti
			   scuri, rosso solo sul punto e su adesso.
			Giro 9: Grafite e rosso "ci sta ma manca qualcosa". Diagnosi: nel silenzio il rosso
			sparisce (sta solo sul livello), la grafite piena si legge come una card scura e non
			come un display, fuori dal display è tutto bianco e grigio, il livello non ha scala.
			Quattro interruttori nel pannello, combinabili, attivi solo su L:
			- Spia REC: il tag diventa pieno nell'accento finché registra; grigio in pausa,
			  contorno ambra o rosso se c'è un problema. Il rosso c'è anche nel silenzio.
			- Materiale: cornice d'alluminio intorno al display (concentrica: raggio 28 più 6),
			  vetro con un riflesso diagonale, gradiente minimo dall'alto, filo chiaro sul bordo.
			  In SwiftUI: un overlay di LinearGradient e uno strokeBorder.
			- Seconda tinta: alluminio caldo per il fondo e per i tratti registrati della
			  giornata, così il resto dello schermo è legato al display.
			- Scala: tacche numerate in dB sotto il livello, come un VU meter.
			Giro 10: ripensare "Metti in pausa". Il tasto attuale pesa quanto il display pur essendo
			la via secondaria (la principale è il doppio tocco), è ambiguo come ogni play/pausa
			(dice l'azione, il tag dice lo stato) ed è il bottone generico di qualunque app. Cinque
			scelte nel pannello (pausa):
			- tasto: quello di oggi, per confronto.
			- slitta: interruttore a due posizioni Registra/Pausa; la levetta è lo stato. Raggi
			  concentrici, 28 fuori e 24 la levetta più 4 di gioco.
			- display: tasto tondo dentro il display, nella riga del server, come un tasto di
			  registratore.
			- vetro: tasto tondo di vetro accanto alla barra in basso, in ogni scheda; il vetro qui
			  è legittimo perché galleggia sopra il contenuto che scorre.
			- tieni: tasto leggero; mezzo secondo premuto per la pausa (si riempie), un tocco per
			  riprendere. Niente pause per sbaglio.
			Giro 11: "altre opzioni". Tre in più nel pannello:
			- tasti: due tasti a scatto, Registra e Pausa, come un registratore a cassette; quello
			  attivo resta abbassato (pieno, ombra interna), l'altro sporge.
			- spia: la spia del display è il comando; la tocchi e passa da Registra a In pausa.
			  Nessun tasto in più, una riga sotto lo dice.
			- angolo: un piccolo tasto Pausa in alto a destra nel display; la batteria scende nella
			  riga del server.
			Giro 12: "non ci siamo, un bottone singolo ma migliore". Tolte slitta, display, vetro,
			tieni, tasti, spia e angolo. Il tasto resta uno, con un'idea: il rosso vuol dire "fai
			registrare". Mentre registra il tasto è grafite e dice Pausa; in pausa diventa rosso e dice
			Riprendi, come il tasto REC di un registratore. Tre forme nel pannello:
			- incassato: a tutta larghezza, dentro una cornice d'alluminio come il display (raggi
			  34 = 28 + 6), etichetta corta.
			- tondo: un tasto REC tondo da 64 dentro un anello da 76, al centro, con l'etichetta
			  sotto.
			- capsula: una capsula chiara al centro, larga quanto serve, con l'icona in un cerchio
			  che prende il colore dello stato.
			Fuori dall'app, da aggiungere a qualunque scelta: il controllo nel Centro di Controllo,
			sul blocco schermo e sul tasto Azione dell'iPhone (Controls e App Intents di iOS), più
			l'attività in tempo reale sul blocco schermo col tempo e la pausa. Così la pausa non
			richiede di aprire l'app.
			Tasti: j, k, l per la variante, t tema, s cambia lo stato (registra, in pausa, ciondolo
			scollegato, server irraggiungibile), p nasconde la barra. Il pulsante di pausa funziona.

			CRITICA AL GIRO 4 (guardato nel browser, a 390x844)
			1. Composizione. In G ci sono 270 px vuoti fra il pulsante e le righe, in H 200 px sotto
			   le righe, in I il pulsante galleggia in mezzo al niente. Lo schermo non è composto: i
			   blocchi sono impilati dall'alto e quello che avanza resta buco.
			2. Scala tipografica. Nove misure (13, 14, 15, 16, 17, 18, 28, 34, 68) senza rapporto fra
			   loro. Le unità del tempo sono 0,42em: a 68 px reggono, a 28 px (H) diventano 12 px e a
			   18 px (I) 7,5 px, illeggibili. La stessa regola applicata a tre misure diverse.
			3. Allineamenti. In H il punto LED sporge a sinistra e manda titolo e sottotitolo a
			   x=39 mentre tavola e righe partono a x=20: due margini sinistri nella stessa schermata.
			   In G "Vedi" va a capo da solo sotto il valore. In I testo centrato sopra, righe
			   giustificate sotto.
			4. Tre varianti, uno scheletro. Intestazione, blocco di stato, capsula di pausa, tre
			   righe chiave-valore: cambiano font e tinta, non l'idea. È un cambio di palette.
			5. Le impostazioni sono la lista di iOS con raggio 26, identica nelle tre: nessuna è
			   disegnata. Il chevron è il carattere "›", la riga "Salvate sul telefono" ha l'icona di
			   una nuvola (dice il contrario), gli interruttori sono blu.
			6. Il colore perde significato. Il blu del LED doveva voler dire "registra", ma è anche
			   sugli interruttori, sulla scheda attiva, sui link: a colpo d'occhio non dice più niente.
			7. Il vetro. La capsula di pausa è di vetro con l'ombra su un fondo piatto: non c'è niente
			   dietro da sfocare, quindi è decorazione. Nella barra la scheda attiva è una pillola
			   grigia con testo blu da 10 px, e l'ingranaggio viene da un altro set di icone (tratto
			   1,9 contro 2, disegno diverso).
			8. Dettagli. I: il render copre l'ora della barra di stato (nero su nero) e la Dynamic
			   Island taglia il cordino; il riquadro nero col raggio 34 su fondo chiaro sembra una
			   foto incollata. H: i tratti della giornata sono quadrati arrotondati da 15 px che
			   sembrano pulsanti, e "Conversazione" è ripetuto tre volte. G: le tacche del livello
			   hanno altezze casuali fisse, non misurano niente. Fili da 0,75 px che su schermo 1x
			   spariscono.

			COSA CAMBIA IN TUTTE
			- Scala unica: 11 (solo etichette della barra), 13, 15, 17, 22, 34, più una misura
			  display per variante. Spazi su griglia da 4 e 8. Raggi concentrici: schermo 55, barra a
			  21 dal bordo con raggio 32, pillola della scheda a 4 dal bordo della barra con raggio 28.
			- Il blu del LED vuol dire solo "sta registrando". Selezioni, schede attive e
			  interruttori sono inchiostro. L'ambra vuol dire "serve un'occhiata" ed è sempre
			  accompagnata da una forma (anello vuoto) e da una frase.
			- Vetro solo sulla barra delle schede (e, in J, sul tasto di pausa accanto alla barra):
			  sono i due comandi che stanno sopra un contenuto che scorre.
			- Icone: un solo set disegnato qui, griglia 24, tratto 2, estremi tondi. Le impostazioni
			  sono i cursori (slider.horizontal.3), non l'ingranaggio.
			- Tempo trascorso 12:08 (la registrazione è partita alle 17:30, sono le 17:42), così non
			  si confonde con la conversazione delle 17:21 da 4 min 47 s. Il tempo scorre davvero.
			- Impostazioni riordinate: prima il ciondolo e i suoi gesti, poi la registrazione, in
			  fondo server e avanzate. Il catalogo è completo in tutte e tre.

			J  LINEA. La scommessa: l'app è un tratto di strada, ciondolo, telefono, server, e i
			   quattro stati sono "dove si è fermato l'audio". Lo schermo disegna quel tratto come una
			   linea con tre fermate: tratteggio blu che scorre dove l'audio passa, linea grigia ferma
			   in pausa, tratto interrotto e anello ambra dove non passa. È un dato, non un ornamento.
			   Tutto allineato a sinistra su una colonna, niente card.
			   Carattere: Instrument Sans (600 per titoli e nomi, 400 per il resto, cifre tabellari).
			   Colori: carta #F7F8FA, inchiostro #14161A, grigio testo #5A606A, filo #DFE2E6,
			   LED #2F5BEA, ambra #9A5600. Scuro: #0F1114, #ECEEF1, #9BA1AB, #262A30, #8CA6FF, #F0A840.
			   Pausa: tasto tondo di vetro staccato dalla barra, come la scheda di ricerca di iOS 26,
			   visibile in ogni scheda. Impostazioni in tre capitoli che ripetono le tre fermate.

			K  DISCO. La scommessa: l'oggetto, ma disegnato e non fotografato. Il ciondolo sta al
			   centro a grandezza naturale (25 mm sono 152 pt su questo schermo), appeso a un cordino
			   che scende dalla Dynamic Island. Tre toni piatti dell'acrilico e della grafite, il LED
			   acceso quando registra, spento in pausa, sagoma tratteggiata quando non è collegato.
			   Tutto il resto è centrato e sottovoce.
			   Carattere: Figtree (600 titoli, 500 comandi, 400 testo).
			   Colori: bruma #E9ECF2, cella #F7F8FB, inchiostro #1B1D22, grigio testo #565C67,
			   acrilico #C2CAD8, grafite #3A3C41, LED #2F5BEA. Scuro: #0C0E12, #171A20, #ECEEF2,
			   #9AA1AD, #2A3242, #34373D, #9DB3FF.
			   Impostazioni a gruppi come iOS, con il disco in testa accanto a nome e batteria.

			L  SCHERMO. La scommessa: il display di un registratore (yuhang, wear-01), una sola
			   superficie tinta in tutta l'app. Dentro: l'etichetta di stato che si legge insieme al
			   tempo ("Registra da 12m08s"), il tempo con le unità piccole, il livello della voce a
			   tacche. Le tacche tornano due volte: la giornata dalle 8 alle 20 a quarti d'ora e il
			   regolo della luminosità del LED nelle impostazioni.
			   Carattere: Archivo, con l'asse della larghezza: 112% per le cifre del display, 100% per
			   il testo.
			   Colori: scocca #EEEFF1, cella #FAFAFB, inchiostro #15171B, grigio testo #5B6068,
			   display #C4CEDE con inchiostro #121722, LED #2F5BEA. Scuro: #0D0E10, #17181B, #ECEDEF,
			   #9A9EA6, display #1A2130 con inchiostro #DDE5F3, LED #86A2FF.
			   Pausa: un tasto pieno sotto il display, niente vetro.

			Fattibilità in SwiftUI: la linea di J è un Path con tratteggio e dashPhase animata; il
			disco di K sono tre Circle; il display di L è una VStack su un RoundedRectangle. La barra
			è la TabView di iOS 26; il tasto staccato di J è un overlay con .glassEffect(). Gli
			interruttori usano .tint. Instrument Sans, Figtree e Archivo sono OFL, vanno in
			UIAppFonts. Il vetro qui è una sfocatura con un bordo chiaro: la rifrazione vera l'HTML
			non la fa.

			Dati veri: firmware 3.0.21, batteria 84%, conversazione delle 17:21 da 4 min 47 s,
			nexus.esse.dev, 3 conversazioni e 1 h 36 min oggi, 53 pacchetti in memoria, versione
			0.3.0, firma che scade il 3 dicembre. Plausibili: orari e durate delle altre due
			conversazioni (11:30 da 48 min, 09:04 da 43 min), i minuti nei vari stati.

			Scelta (26/11/2026): L, palette Grafite e rosso, con spia REC, materiale, seconda tinta e
			scala accese; tasto incassato. Il pannello resta per riprendere la taratura. Decisione in
			DECISIONS ("Interfaccia: il display di un registratore") e ARCHITECTURE #Interfaccia.
			Resta aperto: la scheda Oggi, i comandi di sistema (docs/features/system-controls.md).
		-->
		<style>
			* { box-sizing: border-box; }
			html, body { margin: 0; }
			body { min-height: 100vh; background: #dcdee3; font: 13px/1.4 system-ui, -apple-system, sans-serif; }
			:root[data-theme='dark'] body { background: #1a1b1e; }
			[hidden] { display: none !important; }
			button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
			button:focus-visible { outline: 2px solid var(--ink, #fff); outline-offset: 2px; }
			h1, h2, h3, p, ol, ul, figure { margin: 0; padding: 0; }
			ol, ul { list-style: none; }

			/* Concept chrome. */
			.switch { position: sticky; top: 0; z-index: 100; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px; background: #111214; color: #b4b7bd; }
			.switch button { padding: 6px 10px; border-radius: 6px; background: #26282c; color: #eeeff1; }
			.switch button[aria-pressed='true'] { background: #eeeff1; color: #111214; }
			.switch p { margin-left: 8px; flex: 1 1 280px; min-width: 0; }
			body[data-chrome='off'] .switch { display: none; }
			.stage { display: flex; flex-wrap: wrap; justify-content: center; gap: 48px; padding: 32px 16px 48px; }
			.shot { display: grid; gap: 12px; justify-items: center; }
			.shot > figcaption { color: #50545c; }
			:root[data-theme='dark'] .shot > figcaption { color: #a4a8b0; }

			/* The phone: 390x844 screen, radius 55, bezel 10. */
			.phone { width: 410px; height: 864px; padding: 10px; border-radius: 65px; background: #08080a; box-shadow: 0 0 0 1px #34363b, 0 24px 48px rgb(0 0 0 / 0.22); }
			.screen { position: relative; width: 390px; height: 844px; border-radius: 55px; overflow: hidden; background: var(--bg); color: var(--ink); font: 400 17px/24px var(--font); -webkit-font-smoothing: antialiased; isolation: isolate; }
			.island { position: absolute; z-index: 40; top: 11px; left: 50%; width: 126px; height: 37px; margin-left: -63px; border-radius: 19px; background: #000; }
			.statusbar { position: absolute; z-index: 35; top: 0; left: 0; right: 0; height: 54px; padding-top: 7px; display: flex; justify-content: space-between; align-items: center; font: 600 17px/1 -apple-system, 'SF Pro Text', system-ui, sans-serif; letter-spacing: -0.01em; }
			.statusbar > span { width: 132px; display: flex; justify-content: center; align-items: center; gap: 6px; }
			.statusbar svg { display: block; }
			.homebar { position: absolute; z-index: 40; bottom: 8px; left: 50%; width: 138px; height: 5px; margin-left: -69px; border-radius: 3px; background: var(--ink); }
			.sb-fade { position: absolute; z-index: 30; top: 0; left: 0; right: 0; height: 64px; background: linear-gradient(var(--bg) 54px, transparent); pointer-events: none; }
			.sb-fade.bottom { z-index: 15; top: auto; bottom: 0; height: 120px; background: linear-gradient(transparent, var(--bg) 88px); }
			.num { font-variant-numeric: tabular-nums; }

			/* Glass: only the tab bar and J's detached pause key. */
			.glass { background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(170%); backdrop-filter: blur(18px) saturate(170%); box-shadow: inset 0 0 0 1px var(--glass-rim), inset 0 1px 0 var(--glass-top), 0 10px 28px var(--glass-shadow); }
			.dock { position: absolute; z-index: 20; left: 21px; right: 21px; bottom: 21px; display: flex; gap: 8px; }
			.tabbar { flex: 1; height: 64px; padding: 4px; border-radius: 32px; display: flex; }
			.tabbar button { flex: 1; border-radius: 28px; display: grid; justify-items: center; align-content: center; gap: 3px; font: 600 11px/13px var(--font); color: var(--ink2); }
			.tabbar button svg { width: 24px; height: 24px; }
			.tabbar button[aria-current='true'] { background: var(--pill); color: var(--ink); }
			.fab { flex: none; width: 64px; height: 64px; border-radius: 32px; display: grid; place-items: center; color: var(--ink); }
			.fab svg { width: 26px; height: 26px; }
			.fab:disabled { color: var(--ink3); cursor: default; }

			/* Settings, shared anatomy; each variant dresses it. */
			.scroll { position: absolute; inset: 0; overflow-y: auto; padding: 62px 0 128px; scrollbar-width: none; }
			.scroll::-webkit-scrollbar { display: none; }
			.set-title { font: 600 34px/40px var(--font); letter-spacing: -0.02em; }
			.row { display: flex; align-items: center; gap: 12px; min-height: 52px; }
			.row .main { flex: 1; min-width: 0; padding: 8px 0; }
			.row .main small { display: block; font: 400 13px/18px var(--font); color: var(--ink2); }
			.row .value { font-size: 17px; color: var(--ink2); white-space: nowrap; font-variant-numeric: tabular-nums; }
			.row .chev { flex: none; width: 8px; height: 14px; color: var(--ink3); }
			.row .btn { flex: none; height: 32px; padding: 0 14px; border-radius: 16px; background: var(--pill); font: 500 15px/20px var(--font); }
			.foot { font: 400 13px/18px var(--font); color: var(--ink2); text-wrap: pretty; }
			.toggle { flex: none; position: relative; width: 58px; height: 30px; border-radius: 15px; background: var(--off); transition: background-color 0.2s; }
			.toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 34px; height: 26px; border-radius: 13px; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / 0.25); transition: transform 0.2s; }
			.toggle[aria-checked='true'] { background: var(--on); }
			.toggle[aria-checked='true']::after { transform: translateX(20px); }
			.slider { flex: none; position: relative; width: 148px; height: 28px; }
			.slider::before { content: ''; position: absolute; left: 0; right: 0; top: 12px; height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--ink) var(--p), var(--off) var(--p)); }
			.slider::after { content: ''; position: absolute; top: 2px; left: calc(var(--p) - 12px); width: 24px; height: 24px; border-radius: 12px; background: #fff; box-shadow: 0 0 0 1px rgb(0 0 0 / 0.06), 0 2px 6px rgb(0 0 0 / 0.22); }
			.day-rows li { display: flex; justify-content: space-between; align-items: center; height: 52px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
			.day-rows li span:last-child { color: var(--ink2); font-size: 15px; }

			/* J Linea. */
			body[data-v='j'] .screen { --font: 'Instrument Sans', sans-serif; --bg: #f7f8fa; --ink: #14161a; --ink2: #5a606a; --ink3: #a3a8b1; --line: #dfe2e6; --led: #2f5bea; --warn: #9a5600; --idle: #8b919b; --on: #1c1e23; --off: #d5d8dd; --pill: rgb(20 22 26 / 0.08); --glass: rgb(255 255 255 / 0.66); --glass-rim: rgb(255 255 255 / 0.7); --glass-top: #fff; --glass-shadow: rgb(20 22 26 / 0.12); }
			:root[data-theme='dark'] body[data-v='j'] .screen { --bg: #0f1114; --ink: #eceef1; --ink2: #9ba1ab; --ink3: #555b65; --line: #262a30; --led: #8ca6ff; --warn: #f0a840; --idle: #6b717b; --on: #7d8594; --off: #2b2f36; --pill: rgb(255 255 255 / 0.1); --glass: rgb(36 39 45 / 0.62); --glass-rim: rgb(255 255 255 / 0.1); --glass-top: rgb(255 255 255 / 0.16); --glass-shadow: rgb(0 0 0 / 0.5); }
			.lin { position: absolute; inset: 0; padding: 84px 24px 0; }
			.lin-head { display: grid; grid-template-columns: 12px 1fr auto; column-gap: 16px; align-items: center; }
			.lin-head h1 { font: 600 34px/40px var(--font); letter-spacing: -0.02em; }
			.lin-head time { font: 400 34px/40px var(--font); letter-spacing: -0.02em; }
			.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
			.dot.hollow { background: none; box-shadow: inset 0 0 0 2.5px var(--c); }
			.c-led { --c: var(--led); }
			.c-idle { --c: var(--idle); }
			.c-warn { --c: var(--warn); }

			const TABS = [['now', 'Adesso'], ['today', 'Oggi'], ['settings', 'Impostazioni']];

			const secs = () => (STATES[state].live ? elapsed : STATES[state].t);

			const dayRows = () => `<ul class="day-rows">${DAY.map(([a, b]) => `<li><span>${a}</span><span>${b}</span></li>`).join('')}</ul>`;

			// Settings catalog, one order for all: the pendant and its gestures, then recording, then the plumbing.
			const row = (label, value = '', o = {}) => `

			const R = {

			const FOOT = {

			const commonGroups = () => [

				grp('Server', R.server(), FOOT.server),

			].join('');

			// K's pendant, flat: acrylic shell, frosted lip, graphite core, LED. 152 pt is its real size.
			const disc = (size, mode) => {
				const ghost = mode === 'off';

			const renderJ = () => {
				const s = STATES[state];

				// Node and link per stop: where the audio passes, where it stops.
				const P = {
					rec: [['c-led', 'flow', 'Omi, batteria 84%'], ['c-led', 'flow', "Invia l'audio mentre arriva"], ['c-led', '', 'nexus.esse.dev, in linea']],
					pause: [['c-idle', 'idle', 'Omi, batteria 84%'], ['c-idle', 'idle', 'In pausa, non invia niente'], ['c-idle', '', 'nexus.esse.dev, in linea']],
					off: [['c-warn hollow', 'down', 'Fuori portata da 3 minuti', 1], ['c-idle', 'idle', 'Lo sta cercando'], ['c-idle', '', 'nexus.esse.dev, in linea']],

			const renderK = () => {

							${ghost ? '' : '<rect x="68.5" y="153.5" width="15" height="26" rx="7.5" fill="none" stroke="var(--shell)" stroke-width="3"/>'}

						<div class="dis-text">
							<h1>${state === 'queue' || ghost ? `<span class="dot c-warn${ghost ? ' hollow' : ''}"></span>` : ''}${s.title}</h1>

							${row('Ciondolo', ghost ? 'Fuori portata' : 'Omi, 84%', { nav: true })}

					</div>${dock('now')}`,
					settings: `${statusBar()}<div class="sb-fade"></div><div class="sb-fade bottom"></div><div class="scroll">

						<div class="device"><svg viewBox="0 0 152 152">${disc(56, state)}</svg><div><b>Omi</b><span>${ghost ? 'Non collegato' : 'Collegato, batteria 84%'}</span></div></div>
						${grp('', [row('Firmware', '3.0.21, aggiornato'), row('Luminosità LED', '', { slider: 50 }), ...R.deviceMore()])}
						${commonGroups()}
					</div>${dock('settings')}`,
					captions: ['K Disco, scheda Adesso', 'K Disco, scheda Impostazioni']
				};
			};

			// Round 10: the pause control of L, chosen from the panel (window.PAUSE_MODE).
			const pauseMode = () => window.PAUSE_MODE || 'key';
			const pauseHint = () => `<p class="sch-hint">${state === 'off' ? 'Riprende da sola quando il ciondolo torna vicino.' : 'Oppure tocca due volte il ciondolo.'}</p>`;
			const pauseControlL = () => {
				const m = pauseMode();
				const p = paused();
				const dis = canPause();
				const glyph = p ? '<span class="recdot"></span>' : ICON.pause;

				if (m === 'round') {

				if (m === 'cap') {
					return `<div class="k-center"><button class="k-cap${p ? ' rec' : ''}" data-toggle-pause${dis}><i>${glyph}</i>${p ? 'Riprendi la registrazione' : 'Metti in pausa'}</button></div>${pauseHint()}`;
				}
				if (m === 'well') {
					return `<div class="k-well"><button class="k-btn${p ? ' rec' : ''}" data-toggle-pause${dis}>${glyph}${label}</button></div>${pauseHint()}`;

			const renderL = () => {
				const s = STATES[state];
				const tag = { rec: '<span class="tag"><span class="dot"></span>Registra da</span>', pause: '<span class="tag line">In pausa da</span>', off: '<span class="tag warn">Scollegato da</span>', queue: '<span class="tag"><span class="dot"></span>Registra da</span><span class="tag warn">2 min in coda</span>' }[state];
				const meter = Array.from({ length: 36 }, (_, i) => `<i class="${s.live && i < 21 ? 'on' : ''}"></i>`).join('');
				// The day from 8 to 20, one tick per quarter of an hour.
				const REC = new Set([4, 5, 6, 14, 15, 16, 17, 37]);
				const tape = Array.from({ length: 48 }, (_, i) => `<i class="${REC.has(i) ? 'rec' : i === 38 && s.live ? 'now' : i === 38 && state !== 'rec' ? 'rec' : ''}"></i>`).join('');
				const ruler = Array.from({ length: 33 }, (_, i) => `<i class="${i === 16 ? 'at' : i < 16 ? 'past' : ''}"></i>`).join('');

						<h1 class="set-title">Impostazioni</h1>

							<div class="name">Omi<span>84%${ICON.batt(84)}</span></div>

				};
			};

			const RENDER = { j: renderJ, k: renderK, l: renderL };
			const $ = (q) => document.querySelector(q);
			const draw = () => {
				const out = RENDER[document.body.dataset.v]();
				$('[data-screen="home"]').innerHTML = out.home;
				const set = $('[data-screen="settings"]');
				const y = set.querySelector('.scroll')?.scrollTop || 0;
				set.innerHTML = out.settings;
				set.querySelector('.scroll').scrollTop = y;
				$('[data-caption="home"]').textContent = out.captions[0];
				$('[data-caption="settings"]').textContent = out.captions[1];
				$('[data-state-label]').textContent = STATES[state].label;
			};

			const KEY = `concept:${location.pathname}`;
			const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { return {}; } };
			const save = (s) => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} };
			const root = document.documentElement;
			const still = matchMedia('(prefers-reduced-motion: reduce)');

			$('[data-buttons]').innerHTML = Object.keys(DESC).map((v) => `<button data-v="${v}">${v.toUpperCase()} ${DESC[v].split(':')[0]}</button>`).join(' ');

				$('[data-screen="settings"]').innerHTML = '';

			};
			const setTheme = (t) => { root.dataset.theme = t; save({ ...load(), theme: t }); };
			const setState = (s) => { state = s; draw(); };

			$('.switch').addEventListener('click', (e) => {
				const b = e.target.closest('[data-v]');
				if (b) pick(b.dataset.v);
			});
			$('[data-theme-toggle]').addEventListener('click', () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'));
			$('[data-state-toggle]').addEventListener('click', () => setState(ORDER[(ORDER.indexOf(state) + 1) % ORDER.length]));
			$('.stage').addEventListener('click', (e) => {
				const p = e.target.closest('[data-toggle-pause]');
				if (p && !p.disabled) setState(paused() ? 'rec' : 'pause');

			});
			addEventListener('keydown', (e) => {
				if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest('input, textarea, select')) return;
				const k = e.key.toLowerCase();
				if (k === 't') setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
				else if (k === 's') setState(ORDER[(ORDER.indexOf(state) + 1) % ORDER.length]);

				else pick(k);
			});

			// The clock runs while recording: it is the content, so it runs with reduced motion too.
			setInterval(() => {
				if (!STATES[state].live) return;

			}, 1000);
			// L's level meter follows the voice; still with reduced motion.
			let level = 21;
			setInterval(() => {
				const m = $('[data-meter]');
				if (!m || !STATES[state].live || still.matches) return;
				level = Math.max(6, Math.min(33, level + Math.round((Math.random() - 0.5) * 12)));
				[...m.children].forEach((el, i) => el.classList.toggle('on', i < level));
			}, 160);

			root.dataset.theme = load().theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
			pick(DESC[location.hash.slice(1)] ? location.hash.slice(1) : 'j');
		
			// Round 6: accent and display pairs for L, light and dark. Applied as inline variables on
			// the two screens only while L is shown, so J and K keep their own tokens.
			const PAIRS = {
				blu: { name: 'LED blu', light: { led: '#2f5bea', tag: '#8ca6ff', lcd: '#c4cede', ink: '#121722', ink2: '#3d485c', dim: '#a3adbf', line: '#adb7c9' }, dark: { led: '#86a2ff', tag: '#2f5bea', lcd: '#1a2130', ink: '#dde5f3', ink2: '#93a0b8', dim: '#303a4d', line: '#2b3446' } },

				azzurroarancio: { name: 'Azzurro e arancio', light: { led: '#f2711c', tag: '#ff9a55', lcd: '#cfdcf5', ink: '#0f1e40', ink2: '#3d5280', dim: '#a9bde3', line: '#b4c6e8', key: '#1e3a78', keyInk: '#ffffff', meter: '#f2711c', tape: '#3a5db0', warn: '#c2362b', lcdWarn: '#b3261e' }, dark: { led: '#ff9a55', tag: '#e8641b', lcd: '#1a3366', ink: '#eaf0ff', ink2: '#9db0db', dim: '#284579', line: '#2e4c84', key: '#2a4c93', keyInk: '#ffffff', meter: '#ff9a55', tape: '#4b6fbf', warn: '#ff6b5e', lcdWarn: '#ff8f85' } },
				grafiterosso: { name: 'Grafite e rosso', light: { led: '#e5402f', tag: '#e5402f', lcd: '#2b2e34', ink: '#f1f2f4', ink2: '#a9aeb7', dim: '#3d4149', line: '#464a53', key: '#2b2e34', keyInk: '#ffffff', meter: '#ff5a47', tape: '#2b2e34', warn: '#9a5600', lcdWarn: '#f0a840' }, dark: { led: '#ff5a47', tag: '#e5402f', lcd: '#23262b', ink: '#eceef1', ink2: '#9ba0a9', dim: '#34383f', line: '#3a3e45', key: '#3a3e46', keyInk: '#ffffff', meter: '#ff5a47', tape: '#8b919b', warn: '#f0a840', lcdWarn: '#f0a840' } },
				petroliogiallo: { name: 'Petrolio e giallo', light: { led: '#c9950c', tag: '#d9a20f', lcd: '#0f4c5c', ink: '#eaf4f6', ink2: '#9cc3cc', dim: '#1c6375', line: '#25697a', key: '#0f4c5c', keyInk: '#ffffff', meter: '#ffc83d', tape: '#0f4c5c', warn: '#c2362b', lcdWarn: '#ff8f85' }, dark: { led: '#ffc83d', tag: '#d9a20f', lcd: '#0e3e4a', ink: '#e2f0f3', ink2: '#8db4bd', dim: '#185564', line: '#1e5b6a', key: '#146173', keyInk: '#ffffff', meter: '#ffc83d', tape: '#3a8fa3', warn: '#ff6b5e', lcdWarn: '#ff8f85' } },
				boscocorallo: { name: 'Bosco e corallo', light: { led: '#e85a3c', tag: '#f2674a', lcd: '#1f4a3a', ink: '#eef5f1', ink2: '#a5c2b5', dim: '#2c5e4b', line: '#336653', key: '#1f4a3a', keyInk: '#ffffff', meter: '#ff7a5c', tape: '#1f4a3a', warn: '#9a5600', lcdWarn: '#f0a840' }, dark: { led: '#ff7a5c', tag: '#f2674a', lcd: '#183d30', ink: '#e6f1ec', ink2: '#93b3a5', dim: '#24503f', line: '#2a5646', key: '#255c47', keyInk: '#ffffff', meter: '#ff7a5c', tape: '#4e9479', warn: '#f0a840', lcdWarn: '#f0a840' } },
				salviaarancio: { name: 'Salvia e arancio bruciato', light: { led: '#d35f1e', tag: '#f08a4b', lcd: '#d3dbcb', ink: '#1e2619', ink2: '#4f5b47', dim: '#b6c1ab', line: '#bec8b3', key: '#3f4d35', keyInk: '#ffffff', meter: '#d35f1e', tape: '#3f4d35', warn: '#b3261e', lcdWarn: '#a8261e' }, dark: { led: '#f08a4b', tag: '#d35f1e', lcd: '#1f2619', ink: '#e3eadc', ink2: '#9aa88f', dim: '#2e3826', line: '#343f2b', key: '#4a5a3e', keyInk: '#ffffff', meter: '#f08a4b', tape: '#7f9470', warn: '#ff6b5e', lcdWarn: '#ff8f85' } },
				nottementa: { name: 'Notte e menta', light: { led: '#1a9a6e', tag: '#1fa97a', lcd: '#14213d', ink: '#edf2fb', ink2: '#9fb0cf', dim: '#22335a', line: '#2a3c66', key: '#14213d', keyInk: '#ffffff', meter: '#3ddc97', tape: '#14213d', warn: '#9a5600', lcdWarn: '#f0a840' }, dark: { led: '#3ddc97', tag: '#1fa97a', lcd: '#121d36', ink: '#e6ecf8', ink2: '#91a1c2', dim: '#1e2d50', line: '#24345a', key: '#22345f', keyInk: '#ffffff', meter: '#3ddc97', tape: '#5671a8', warn: '#f0a840', lcdWarn: '#f0a840' } },
				lcdrosso: { name: 'LCD e rosso', light: { led: '#c8361f', tag: '#ff6a52', lcd: '#d4dbae', ink: '#1e2414', ink2: '#4e573a', dim: '#b9c193', line: '#c1c99e', key: '#1e2414', keyInk: '#e9edcf', tape: '#4e573a', warn: '#9a5600', lcdWarn: '#6e3d00' }, dark: { led: '#ff6a52', tag: '#c8361f', lcd: '#2a3020', ink: '#dde5b8', ink2: '#a0a981', dim: '#3a4230', line: '#404836', key: '#3a4230', keyInk: '#dde5b8', tape: '#8e9a6b', warn: '#f0a840', lcdWarn: '#f0a840' } },
				grafite: { name: 'Grafite', light: { led: '#15171b', tag: '#ffffff', lcd: '#d5d7db', ink: '#15171b', ink2: '#4e535b', dim: '#b3b7bd', line: '#bfc3c9' }, dark: { led: '#eceef1', tag: '#15171b', lcd: '#1c1e22', ink: '#eceef1', ink2: '#9a9ea6', dim: '#34373d', line: '#2c2f34' } }
			};
			const VARS = { led: '--led', tag: '--tag-led', lcd: '--lcd', ink: '--lcd-ink', ink2: '--lcd-ink2', dim: '--lcd-dim', line: '--lcd-line', key: '--key', keyInk: '--key-ink', meter: '--meter-on', tape: '--tape-rec', warn: '--warn', lcdWarn: '--lcd-warn' };
			let tune = load().tune || { pair: 'grafiterosso', custom: null };
			let opts = load().opts || { rec: true, mat: true, tint: true, scale: true };
			// Second tint: warm aluminium for the ground and the day's recorded blocks.
			const TINT = { light: { '--bg': '#e4e5e2', '--cell': '#f1f1ef', '--off': '#d2d3cf', '--tape-rec': '#7c818a', '--bezel': '#cfd0cc' }, dark: { '--bg': '#141518', '--cell': '#1d1f23', '--off': '#2a2c30', '--tape-rec': '#6f757f', '--bezel': '#2c2f34' } };
			const tuned = () => {
				const theme = root.dataset.theme === 'dark' ? 'dark' : 'light';
				const t = { ...PAIRS[tune.pair][theme] };
				if (tune.custom) {
					t.led = theme === 'dark' ? `color-mix(in srgb, ${tune.custom} 70%, white)` : tune.custom;
					t.tag = theme === 'dark' ? tune.custom : `color-mix(in srgb, ${tune.custom} 55%, white)`;
				}
				return t;
			};
			const applyTune = () => {
				const onL = document.body.dataset.v === 'l';
				const t = tuned();
				const theme = root.dataset.theme === 'dark' ? 'dark' : 'light';
				for (const o of ['rec', 'mat', 'tint', 'scale']) document.body.classList.toggle(`x-${o}`, onL && !!opts[o]);
				document.querySelectorAll('[data-opt]').forEach((c) => { c.checked = !!opts[c.dataset.opt]; });
				document.querySelectorAll('.screen').forEach((el) => {
					for (const [k, v] of Object.entries(VARS)) {
						if (onL && t[k]) el.style.setProperty(v, t[k]);
						else el.style.removeProperty(v);
					}
					for (const [v, val] of Object.entries(TINT[theme])) {
						if (onL && opts.tint) el.style.setProperty(v, val);
						else if (v !== '--tape-rec') el.style.removeProperty(v);
					}
					if (onL && !opts.tint && !t.tape) el.style.removeProperty('--tape-rec');
				});
				document.querySelectorAll('[data-pair]').forEach((b) => b.setAttribute('aria-pressed', String(!tune.custom && b.dataset.pair === tune.pair)));
				document.querySelector('[data-values]').textContent = `${tune.custom ? 'accento ' + tune.custom + ' su ' : ''}${PAIRS[tune.pair].name}: ` + Object.entries(tuned()).map(([k, v]) => `${VARS[k]} ${v}`).join('; ');
			};
			document.querySelector('[data-presets]').innerHTML = Object.entries(PAIRS)
				.map(([k, p]) => `<button data-pair="${k}"><i style="background:${p.light.key || p.light.led}"></i>${p.light.key ? `<i style="background:${p.light.led};margin-left:-4px"></i>` : ''}${p.name}</button>`).join('');
			document.querySelector('[data-presets]').addEventListener('click', (e) => {
				const b = e.target.closest('[data-pair]');
				if (!b) return;
				tune = { pair: b.dataset.pair, custom: null };
				save({ ...load(), tune });
				applyTune();
			});
			document.querySelector('[data-opts]').addEventListener('change', (e) => {
				const c = e.target.closest('[data-opt]');
				if (!c) return;
				opts = { ...opts, [c.dataset.opt]: c.checked };
				save({ ...load(), opts });
				applyTune();
			});
			document.querySelector('[data-custom]').addEventListener('input', (e) => {
				tune = { ...tune, custom: e.target.value };
				save({ ...load(), tune });
				applyTune();
			});
			new MutationObserver(applyTune).observe(document.body, { attributes: true, attributeFilter: ['data-v'] });
			new MutationObserver(applyTune).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
			applyTune();
		
			// Round 10: pause mode and the hold gesture.
			window.PAUSE_MODE = ['key', 'well', 'round', 'cap'].includes(load().pauseMode) ? load().pauseMode : 'well';
			const markPm = () => document.querySelectorAll('[data-pm]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.pm === window.PAUSE_MODE)));
			document.querySelector('[data-pmodes]').addEventListener('click', (e) => {
				const b = e.target.closest('[data-pm]');
				if (!b) return;
				window.PAUSE_MODE = b.dataset.pm;
				save({ ...load(), pauseMode: window.PAUSE_MODE });
				markPm();
				draw();
				applyTune();
			});
			markPm();
			draw();
			applyTune();
		</script>
	</body>
</html>
